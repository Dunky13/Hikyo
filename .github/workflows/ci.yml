# CI for the walking skeleton (#42): build, vet, generated-code freshness,
# and the full test suite including the cross-engine conformance harness on
# sqlite and postgres. Actions pinned by commit SHA and the Go toolchain
# pinned exactly, per the system-architecture ADR's pinned-everything rule.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Shellcheck (pinned archive)
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz" \
            --output "$archive"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck" \
            scripts/lib/*.sh scripts/ci/*.sh scripts/release/*.sh install/install.sh.in
      - name: Actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require DCO sign-off on every PR commit
        run: >-
          ./scripts/ci/check-dco.sh
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  supply-chain-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Chart renders and carries release substitution anchors
        run: |
          grep -Fx "  repository: ghcr.io/dunky13/wenv" chart/wenv/values.yaml
          grep -Fx "  digest: sha256:RELEASE_IMAGE_DIGEST" chart/wenv/values.yaml
          helm lint chart/wenv --set database.existingSecret=fixture \
            --set 'network.trustedProxyCIDRs={10.42.0.0/16}'
          helm template fixture chart/wenv --set database.existingSecret=fixture \
            --set 'network.trustedProxyCIDRs={10.42.0.0/16}' >/dev/null
          ! helm template fixture chart/wenv \
            --set database.existingSecret=fixture >/dev/null 2>&1
      - name: Release trust and refusal fixtures
        run: ./scripts/release/test-fixtures.sh
      - name: Manifest binding fixture
        run: ./scripts/release/bind-manifest_test.sh
      - name: Release manifest fixture
        run: ./scripts/release/create-manifest_test.sh
      - name: DCO fixture
        run: ./scripts/ci/check-dco_test.sh
      - name: Immutable-tag probe fixture
        run: ./scripts/release/probe-tag-move_test.sh
      - name: Release-tag guard fixture
        run: ./scripts/release/check-tag_test.sh
      - name: OCI version guard fixture
        run: ./scripts/release/check-oci-unused_test.sh
      - name: Release channel fixture
        run: ./scripts/release/release-channel_test.sh
      - name: Pinned installer fixture
        run: ./scripts/release/render-installer_test.sh
      - name: GoReleaser configuration and snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean --skip=publish
      - name: Classify complete snapshot manifest
        run: ./scripts/release/snapshot-manifest_test.sh

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_USER: wenv
          POSTGRES_PASSWORD: wenv
          POSTGRES_DB: wenv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wenv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # exact toolchain pinned by go.mod's go directive

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Generated code is fresh
        run: |
          go tool sqlc generate
          git diff --exit-code -- internal/store/sqlitegen internal/store/pggen
          # git diff misses newly generated untracked files
          test -z "$(git status --porcelain --untracked-files=all -- internal/store/sqlitegen internal/store/pggen)"

      - name: Test (sqlite + postgres conformance)
        env:
          WENV_TEST_POSTGRES_DSN: postgres://wenv:wenv@127.0.0.1:5432/wenv_test
        run: go test ./...
