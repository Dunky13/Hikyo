# CI for the walking skeleton (#42): pull requests run every validation domain
# affected by their changed paths; main runs the complete suite, including the
# sqlite/postgres conformance harness. Actions and toolchains remain pinned per
# the system-architecture ADR's pinned-everything rule.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # PR updates supersede the same PR; every main push stays independently
  # queued so a burst cannot discard the middle commit's CI/cache seed.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keep the required workflow present on every PR, then select jobs inside it.
  # Unknown paths and changes to this classifier fail closed to the full plan.
  changes:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.classify.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          if [ "$EVENT_NAME" = push ]; then
            plan=$(./scripts/ci/classify-changed-paths.sh --all)
          elif git cat-file -e "$BASE_SHA:scripts/ci/classify-changed-paths.sh" 2>/dev/null; then
            trusted_classifier="$RUNNER_TEMP/classify-changed-paths.sh"
            git show "$BASE_SHA:scripts/ci/classify-changed-paths.sh" >"$trusted_classifier"
            chmod +x "$trusted_classifier"
            plan=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" |
              "$trusted_classifier" --files)
          else
            plan=$(jq -cn '{
              client: true,
              docs: true,
              generated: true,
              headline_guarantee: true,
              lint: true,
              release_snapshot: true,
              supply_chain_checks: true,
              test: true,
              web: true
            }')
          fi
          printf 'plan=%s\n' "$plan" >>"$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan).lint }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore shared Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: Restore lint Go cache
        id: lint-go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-lint-v1.7.12-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-lint-v1.7.12-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-lint-v1.7.12-${{ runner.os }}-
      - name: Shellcheck (pinned archive)
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            --retry 4 --retry-delay 2 --retry-all-errors \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz" \
            --output "$archive"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck" \
            scripts/lib/*.sh scripts/ci/*.sh scripts/release/*.sh install/install.sh.in
      - name: Actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Save lint Go cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.lint-go-cache.outputs.cache-primary-key }}

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require DCO sign-off on every PR commit
        run: >-
          ./scripts/ci/check-dco.sh
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  supply-chain-checks:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan).supply_chain_checks }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - name: Chart renders and carries release substitution anchors
        run: |
          grep -Fx "  repository: ghcr.io/dunky13/hikyo" chart/hikyo/values.yaml
          grep -Fx "  digest: sha256:RELEASE_IMAGE_DIGEST" chart/hikyo/values.yaml
          helm lint chart/hikyo --set database.existingSecret=fixture \
            --set 'network.trustedProxyCIDRs={10.42.0.0/16}'
          helm template fixture chart/hikyo --set database.existingSecret=fixture \
            --set 'network.trustedProxyCIDRs={10.42.0.0/16}' >/dev/null
          ! helm template fixture chart/hikyo \
            --set database.existingSecret=fixture >/dev/null 2>&1
      - name: Release trust and refusal fixtures
        run: ./scripts/release/test-fixtures.sh
      - name: Manifest binding fixture
        run: ./scripts/release/bind-manifest_test.sh
      - name: Release manifest fixture
        run: ./scripts/release/create-manifest_test.sh
      - name: DCO fixture
        run: ./scripts/ci/check-dco_test.sh
      - name: Required-jobs fixture
        run: ./scripts/ci/check-required-jobs_test.sh
      - name: Changed-path classifier fixture
        run: ./scripts/ci/classify-changed-paths_test.sh
      - name: Trusted CI scripts fixture
        run: ./scripts/ci/check-trusted-ci-scripts_test.sh
      - name: Immutable-tag probe fixture
        run: ./scripts/release/probe-tag-move_test.sh
      - name: Release-tag guard fixture
        run: ./scripts/release/check-tag_test.sh
      - name: OCI version guard fixture
        run: ./scripts/release/check-oci-unused_test.sh
      - name: Release channel fixture
        run: ./scripts/release/release-channel_test.sh
      - name: Pinned installer fixture
        run: ./scripts/release/render-installer_test.sh

  release-snapshot:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan).release_snapshot }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore shared Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: Restore release-snapshot Go cache
        id: release-snapshot-go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-release-snapshot-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-release-snapshot-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-release-snapshot-${{ runner.os }}-
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: corepack enable
      # GoReleaser builds with the `ui` tag, so its isolated job must produce
      # the embedded SPA before compiling all six release targets.
      - name: Build the SPA (the `ui` build tag embeds it)
        working-directory: web
        run: |
          pnpm --dir ../clients/ts install --frozen-lockfile
          pnpm install --frozen-lockfile
          pnpm build
      - name: GoReleaser configuration and snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean --skip=publish
      - name: Classify complete snapshot manifest
        run: ./scripts/release/snapshot-manifest_test.sh
      - name: Save release-snapshot Go cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.release-snapshot-go-cache.outputs.cache-primary-key }}

  generated:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan).generated }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore shared Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: Restore generated-code Go cache
        id: generated-go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-generated-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-generated-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-generated-${{ runner.os }}-
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Generated code is fresh
        run: |
          go tool sqlc generate
          go tool oapi-codegen --config api/oapi-codegen.yaml api/openapi.yaml
          git diff --exit-code -- internal/store/sqlitegen internal/store/pggen api/apigen
          # git diff misses newly generated untracked files
          test -z "$(git status --porcelain --untracked-files=all -- internal/store/sqlitegen internal/store/pggen api/apigen)"
      - name: Save generated-code Go cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.generated-go-cache.outputs.cache-primary-key }}

  # The TypeScript half of the contract chain. It is a separate job because it
  # needs a different toolchain, and because a Go-only change must not be able
  # to leave the generated client stale without anyone noticing.
  client:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan).client }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: corepack enable
      - name: Install (frozen lockfile)
        working-directory: clients/ts
        run: pnpm install --frozen-lockfile
      - name: Regenerate from the contract
        working-directory: clients/ts
        run: pnpm run generate
      - name: Generated client is fresh
        run: |
          git diff --exit-code -- clients/ts/src/generated
          test -z "$(git status --porcelain --untracked-files=all -- clients/ts/src/generated)"
      - name: Typecheck
        working-directory: clients/ts
        run: pnpm run typecheck
      - name: Contract round-trip fixtures (3.1 profile, Zod half)
        working-directory: clients/ts
        run: pnpm run test

  docs:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan).docs }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
      - name: Typecheck, build, and assert O4-O6 policy content
        run: ./scripts/ci/verify-docs.sh

  # The SPA and its flow suite (#56). One job, because the ordering is the
  # point: the frontend must be BUILT before Go can embed it, the Go tests must
  # pass before a browser is worth starting, and the flow registry's closure
  # check runs first of all — a locked surface without a flow should fail in
  # seconds, not after a full browser suite has passed.
  web:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan).web }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore shared Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: Restore web Go cache
        id: web-go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-web-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-web-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-web-${{ runner.os }}-
      - name: Enable pnpm
        run: corepack enable

      # The SPA consumes clients/ts generated sources through aliases, so the
      # generated Zod schemas resolve `zod` from clients/ts's own node_modules
      # — without this install, typecheck and build fail on TS2307.
      - name: Install client package (generated sources' own deps)
        working-directory: clients/ts
        run: pnpm install --frozen-lockfile

      - name: Install (frozen lockfile)
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: web
        run: pnpm run typecheck

      # Unit tests include the flow registry's closure check and its own
      # negative fixtures — a check that cannot fail is not a check.
      - name: Unit tests and flow-registry closure
        working-directory: web
        run: pnpm run test

      - name: Build the SPA
        working-directory: web
        run: pnpm run build

      # The embed only compiles with the `ui` tag, and only after the build
      # above. This is the step that proves the tagged binary is buildable at
      # all; the untagged build and the full Go suite live in the `test` job
      # and stay green without ever running pnpm.
      - name: Build the binary with the embedded UI
        run: go build -tags ui ./...

      - name: Go tests (transport, serving rules, browser session)
        # Restored GOCACHE may contain passing test results. Compile from cache,
        # but always execute this job's tests against its fresh build.
        run: go test -count=1 -tags ui ./internal/server/... ./internal/webui/...

      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Flow suite (desktop + mobile)
        working-directory: web
        run: pnpm run e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7
      - name: Save web Go cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.web-go-cache.outputs.cache-primary-key }}

  test:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan).test }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_USER: hikyo
          POSTGRES_PASSWORD: hikyo
          POSTGRES_DB: hikyo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hikyo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # exact toolchain pinned by go.mod's go directive
          cache: false
      - name: Restore shared Go module cache
        id: go-module-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: Restore test Go cache
        id: test-go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-

      - name: Populate shared Go module cache
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (sqlite + postgres conformance)
        env:
          HIKYO_TEST_POSTGRES_DSN: postgres://hikyo:hikyo@127.0.0.1:5432/hikyo_test
        # Compile from restored GOCACHE, but never replay results: PostgreSQL
        # conformance must exercise this run's fresh service container.
        run: go test -count=1 ./...
      - name: Save test Go cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.test-go-cache.outputs.cache-primary-key }}
      # One trusted writer avoids the setup-go race where the first, smallest
      # job permanently won the shared module key for this dependency graph.
      - name: Save shared Go module cache
        if: >-
          success() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.go-module-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.go-module-cache.outputs.cache-primary-key }}

  # The headline guarantee, as its own named context (#76, mvp-boundary K3):
  # a stolen database and a stolen backup, without the root key, yield no
  # values and no replayable credentials. It runs the backup drill on both
  # engines, which is where the planted-plaintext scan of the dump AND of the
  # age artifact lives, together with the replay of every credential artifact
  # an attacker can lift out of the dump.
  #
  # It is a separate job rather than a step inside `test` so the guarantee has
  # a context of its own: a green `test` that skipped these because someone
  # narrowed a -run pattern would still look green, and this is the one row
  # the project's positioning rests on.
  headline-guarantee:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan).headline_guarantee }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_USER: hikyo
          POSTGRES_PASSWORD: hikyo
          POSTGRES_DB: hikyo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hikyo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore shared Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: Restore test Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-
      - name: Container round-trip, stanza exclusivity and truncation refusal
        run: go test -count=1 ./internal/crypto/backup/
      - name: Planted-plaintext scan of dump and backup, and credential replay refusal
        env:
          HIKYO_TEST_POSTGRES_DSN: postgres://hikyo:hikyo@127.0.0.1:5432/hikyo_test
        run: >-
          go test -count=1 -v ./internal/isolation/
          -run 'TestBackupRestoreDrill|TestNoBulkAcceptInTheAPISurface'
      - name: Automatic pre-migration export, with recipients and without
        run: go test -count=1 ./internal/app/ -run TestPreMigrationExport

  # The permanent required context. Every validation job is named here so a
  # future job split cannot accidentally weaken branch protection.
  ci-required:
    if: always()
    needs:
      - changes
      - client
      - dco
      - docs
      - generated
      - headline-guarantee
      - lint
      - release-snapshot
      - supply-chain-checks
      - test
      - web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require every validation job
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          PLAN_JSON: ${{ needs.changes.outputs.plan }}
        run: |
          trusted_checker="$RUNNER_TEMP/check-required-jobs.sh"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            cp ./scripts/ci/check-required-jobs.sh "$trusted_checker"
          else
            git show "$BASE_SHA:scripts/ci/check-required-jobs.sh" >"$trusted_checker"
          fi
          chmod +x "$trusted_checker"

          if "$trusted_checker" --supports-plan-v1 >/dev/null 2>&1; then
            "$trusted_checker" "$GITHUB_EVENT_NAME" "$NEEDS_JSON" "$PLAN_JSON"
          else
            legacy_needs=$(printf '%s\n' "$NEEDS_JSON" | jq -c 'del(.changes)')
            "$trusted_checker" "$GITHUB_EVENT_NAME" "$legacy_needs"
          fi
