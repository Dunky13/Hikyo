name: docs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "scripts/ci/check-docs-live*"
      - "scripts/ci/check-fallback-channel*"
      - "scripts/ci/check-oss-policy*"
      - "scripts/ci/verify-docs.sh"
      - "release/repository/fallback-channel-test.json"
      - "CONTRIBUTING.md"
      - "GOVERNANCE.md"
      - "LICENSE"
      - "README.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "TRADEMARK.md"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: write
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
      - name: Typecheck, build, and assert O4-O6 policy content
        run: ./scripts/ci/verify-docs.sh
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Archive Pages artifact, including security.txt
        run: |
          tar --dereference --hard-dereference \
            --directory docs/site/dist \
            --exclude=.git \
            --exclude=.github \
            -cvf "$RUNNER_TEMP/artifact.tar" .
          tar -tf "$RUNNER_TEMP/artifact.tar" |
            grep -Fx './.well-known/security.txt'
      - name: Upload Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
      - name: Verify custom-domain pages and assets
        env:
          DOCS_ATTEMPTS: "12"
          DOCS_CACHE_BUST: ${{ github.sha }}
          DOCS_RETRY_DELAY_SECONDS: "10"
        run: ./scripts/ci/check-docs-live.sh https://hikyo.app security@developwent.io
