name: release-build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOFLAGS: -mod=readonly

jobs:
  build-unsigned-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: corepack enable
      # working-directory matters: corepack resolves the packageManager pin
      # from the CWD's package.json — from the repo root (which has none) it
      # falls back to its default pnpm and the pinned project refuses it.
      - name: Build the SPA (the `ui` build tag embeds it)
        working-directory: web
        run: |
          pnpm --dir ../clients/ts install --frozen-lockfile
          pnpm install --frozen-lockfile
          pnpm build
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Resolve immutable release identity
        id: identity
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          TAG_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/release/check-tag.sh "$REPOSITORY" "$TAG" "$TAG_SHA"
          HIKYO_ALLOW_IMMUTABLE_TAG_PROBE=YES \
            ./scripts/release/probe-tag-move.sh "$REPOSITORY" v-ruleset-probe "$TAG_SHA"
          image=$(printf 'ghcr.io/%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          printf 'image=%s\n' "$image" >>"$GITHUB_OUTPUT"

      - name: Verify production trust bootstrap
        id: candidate
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          test -f release/trust/root.json
          test -f release/trust/metadata.json
          test -f release/trust/metadata.sigstore.json
          recovery=$(jq -r '.recovery.public_key' release/trust/root.json)
          test -f "release/trust/$recovery"
          recovery_sha=$(jq -r '.recovery.sha256' release/trust/root.json)
          actual_sha=$(sha256sum "release/trust/$recovery" | awk '{print $1}')
          test "$actual_sha" = "$recovery_sha"
          cosign verify-blob --insecure-ignore-tlog \
            --key "release/trust/$recovery" \
            --bundle release/trust/metadata.sigstore.json \
            release/trust/metadata.json
          jq -r '.primary_keys[].public_key' release/trust/metadata.json | while IFS= read -r key; do
            test -f "release/trust/$key"
          done
          version=${TAG#v}
          candidate="$RUNNER_TEMP/release-candidate.json"
          ./scripts/release/resolve-candidate.sh \
            release/trust/metadata.json "$version" "$COMMIT" pending >"$candidate"
          candidate_sha256=$(sha256sum "$candidate" | awk '{print $1}')
          resolved_version=$(jq -r '.version' "$candidate")
          resolved_commit=$(jq -r '.commit' "$candidate")
          printf 'path=%s\nsha256=%s\nversion=%s\ncommit=%s\n' \
            "$candidate" "$candidate_sha256" "$resolved_version" "$resolved_commit" >>"$GITHUB_OUTPUT"

      - name: Test release source
        run: |
          go test ./...
          ./scripts/release/test-fixtures.sh

      - name: Assert O4-O6 docs and governance release gates
        run: |
          ./scripts/ci/verify-docs.sh
          ./scripts/ci/check-fallback-channel-test.sh \
            release/repository/fallback-channel-test.json \
            security@developwent.io
          ./scripts/ci/check-docs-live.sh \
            https://hikyo.app security@developwent.io

      - name: Validate candidate for GoReleaser
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
          CANDIDATE_SHA256: ${{ steps.candidate.outputs.sha256 }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
          RELEASE_COMMIT: ${{ steps.candidate.outputs.commit }}
        run: |
          ./scripts/release/check-candidate.sh "$CANDIDATE" "$CANDIDATE_SHA256"
          jq -e --arg version "$RELEASE_VERSION" --arg commit "$RELEASE_COMMIT" '
            .version == $version and .commit == $commit
          ' "$CANDIDATE" >/dev/null

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        env:
          HIKYO_RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
          HIKYO_RELEASE_COMMIT: ${{ steps.candidate.outputs.commit }}
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --skip=publish

      - name: Verify GoReleaser candidate identity
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
          CANDIDATE_SHA256: ${{ steps.candidate.outputs.sha256 }}
        run: |
          ./scripts/release/check-candidate.sh "$CANDIDATE" "$CANDIDATE_SHA256"
          jq -e --slurpfile candidate "$CANDIDATE" '
            .version == $candidate[0].version and
            .commit == $candidate[0].commit
          ' dist/metadata.json >/dev/null

      - name: Prepare canonical image inputs
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
          CANDIDATE_SHA256: ${{ steps.candidate.outputs.sha256 }}
        run: |
          ./scripts/release/check-candidate.sh "$CANDIDATE" "$CANDIDATE_SHA256"
          commit=$(jq -r '.commit' "$CANDIDATE")
          ./scripts/release/prepare-image-root.sh \
            dist image-root "$commit" .goreleaser.yaml

      - name: Remove GoReleaser internal metadata
        run: rm -f dist/artifacts.json dist/config.yaml dist/metadata.json

      - name: Source dependency SBOM (Go and frontend)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/hikyo-source.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679fd # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse an already-used image version
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          VERSION: ${{ steps.candidate.outputs.version }}
        run: ./scripts/release/check-oci-unused.sh "$IMAGE:$VERSION"
      - name: Publish unsigned multi-arch image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.identity.outputs.image }}:${{ steps.candidate.outputs.version }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.candidate.outputs.commit }}
            org.opencontainers.image.version=${{ steps.candidate.outputs.version }}

      - name: Published image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.identity.outputs.image }}@${{ steps.image.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: dist/hikyo-image.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false

      - name: Package and publish digest-pinned Helm chart
        id: chart
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
          CANDIDATE_SHA256: ${{ steps.candidate.outputs.sha256 }}
          IMAGE: ${{ steps.identity.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          ./scripts/release/check-candidate.sh "$CANDIDATE" "$CANDIDATE_SHA256"
          version=$(jq -r '.version' "$CANDIDATE")
          chart_dir="$RUNNER_TEMP/hikyo-chart"
          cp -R chart/hikyo "$chart_dir"
          active_key=$(jq -r '.public_key' "$CANDIDATE")
          cp release/trust/root.json "$chart_dir/files/release/trust/root.json"
          cp "release/trust/$active_key" "$chart_dir/files/release/trust/primary.pub"
          sed -i "s|repository: ghcr.io/hikyo-org/hikyo|repository: $IMAGE|" "$chart_dir/values.yaml"
          sed -i "s|sha256:RELEASE_IMAGE_DIGEST|$IMAGE_DIGEST|" "$chart_dir/values.yaml"
          grep -Fx "  repository: $IMAGE" "$chart_dir/values.yaml"
          grep -Fx "  digest: $IMAGE_DIGEST" "$chart_dir/values.yaml"
          helm lint "$chart_dir" --set database.existingSecret=hikyo-database \
            --set 'network.trustedProxyCIDRs={10.42.0.0/16}'
          helm template fixture "$chart_dir" --set database.existingSecret=hikyo-database \
            --set 'network.trustedProxyCIDRs={10.42.0.0/16}' >/dev/null
          helm package "$chart_dir" --version "$version" --app-version "$version" --destination dist
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          chart=$(printf 'ghcr.io/%s/charts/hikyo' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          ./scripts/release/check-oci-unused.sh "$chart:$version"
          push_output=$(helm push "dist/hikyo-$version.tgz" "oci://$(dirname "$chart")")
          chart_digest=$(printf '%s\n' "$push_output" | awk '$1 == "Digest:" {print $2}' | tail -n 1)
          printf '%s\n' "$chart_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf 'chart=%s\nchart_digest=%s\n' "$chart" "$chart_digest" >>"$GITHUB_OUTPUT"

      - name: Prepare offline OCI signing payloads
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CHART: ${{ steps.chart.outputs.chart }}
          CHART_DIGEST: ${{ steps.chart.outputs.chart_digest }}
        run: |
          cosign generate "$IMAGE@$IMAGE_DIGEST" >dist/image-index.oci-payload.json
          cosign generate "$CHART@$CHART_DIGEST" >dist/chart-index.oci-payload.json

      - name: Render installer with pinned trust root
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
          CANDIDATE_SHA256: ${{ steps.candidate.outputs.sha256 }}
        run: |
          ./scripts/release/check-candidate.sh "$CANDIDATE" "$CANDIDATE_SHA256"
          version=$(jq -r '.version' "$CANDIDATE")
          ./scripts/release/render-installer.sh "$version" \
            release/trust/root.json scripts/release/verify-bundle.sh dist/install.sh

      - name: Build release manifest
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
          CANDIDATE_SHA256: ${{ steps.candidate.outputs.sha256 }}
          IMAGE: ${{ steps.identity.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CHART: ${{ steps.chart.outputs.chart }}
          CHART_DIGEST: ${{ steps.chart.outputs.chart_digest }}
        run: |
          ./scripts/release/check-candidate.sh "$CANDIDATE" "$CANDIDATE_SHA256"
          cp "$CANDIDATE" dist/release-candidate.json
          ./scripts/release/create-manifest.sh dist/release-candidate.json \
            "$IMAGE" "$IMAGE_DIGEST" "$CHART" "$CHART_DIGEST" \
            dist

      - name: Create unsigned draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [ "$(./scripts/release/release-channel.sh "$TAG")" = prerelease ]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --draft "${prerelease[@]}" \
            --title "$TAG" --notes "Unsigned draft. Publish only after the offline signing ceremony."
          assets=(dist/release-manifest.json)
          while IFS= read -r name; do
            assets+=("dist/$name")
          done < <(jq -r '.artifacts[].name' dist/release-manifest.json)
          gh release upload "$TAG" "${assets[@]}"
