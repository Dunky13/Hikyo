  /api/v1/orgs/{org}/projects/{project}/environments/{environment}/revisions/{revision}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/EnvironmentID"
      - name: revision
        in: path
        required: true
        description: The revision number, or `latest`.
        schema:
          type: string
          pattern: "^(latest|[1-9][0-9]{0,18})$"
    get:
      operationId: getRevision
      tags: [revisions]
      summary: One revision, with its change token.
      description: |
        The change token is DERIVED here from the current root token key over
        the snapshot's delivery manifest; it is never stored. That is what
        makes `rotate-token-key` move every token while content, revision
        numbers and pinned input revisions stay exactly where they are.

        The token is non-secret metadata by construction - keyed, so
        unforgeable and un-invertible without the key, which is why it may flow
        into pod annotations and logs. The key set it accompanies carries names
        and classifications and no values.
      x-hikyo-class: tenant
      x-hikyo-operation: revision.show
      x-hikyo-formula: [read@environment]
      x-hikyo-artifacts: [human-session, machine-credential]
      x-hikyo-min-revision: 1
      responses:
        "200":
          description: The revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/orgs/{org}/projects/{project}/environments/{environment}/values/export:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/EnvironmentID"
    post:
      operationId: exportValues
      tags: [values]
      summary: Export one environment's resolved snapshot.
      description: |
        The one BULK-DISCLOSURE verb, and what "fetch resolved" actually is. It
        reads a committed snapshot, never live values.

        The formulas are stated separately because the capabilities imply
        nothing about each other: current material is `read` AND `reveal`;
        historical material - any revision that is not the latest - is `read`
        AND `reveal-history`. Without `reveal`, `config` values are returned in
        plaintext (classification IS the sensitivity boundary) and `secret`
        keys report write-presence with no value.

        It is a POST because disclosure is an ACT: one audit event is written
        per disclosed key, durably, before any plaintext leaves the server.
      x-hikyo-class: tenant
      x-hikyo-operation: value.export-reveal
      x-hikyo-formula: [read@environment, reveal@environment]
      # Human-session only, and the omission is a decision. A machine principal
      # CAN export - `read` alone returns `config` plaintext and `secret`
      # write-presence - but the route's declared formula is the revealing one,
      # and no machine class in the permission ADR's allowlists may hold
      # `reveal` today: machine `reveal` arrives through the source-of-truth
      # ADR's explicit per-project operator opt-in, which is not modelled yet.
      # Declaring an eligibility the registry cannot honour would be a lie on
      # the wire; this joins when the opt-in lands.
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportValuesRequest"
      responses:
        "200":
          description: The resolved snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportedValues"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/orgs/{org}/projects/{project}/events:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: watchProjectEvents
      tags: [revisions]
      summary: The advisory live-update stream (SSE).
      description: |
        Server-sent events, metadata only. An event says that something
        changed - an environment advanced (`revision.published`), a principal
        staged a draft (`pending.staged`), a published cell moved
        (`cell.changed`) - and never what it changed to. It carries no value
        in any form and NO CHANGE TOKEN.

        `cell.changed` claims exactly what the publish knew: that cell
        advanced. A subscriber holding a draft on the named cell derives "my
        draft is stale" from its own draft plus this event; the server never
        asserts staleness it did not check.

        Every event is authorized against the environment it names, at emit
        time, so a grant revoked mid-session takes effect on the NEXT event
        rather than at the next reconnect. Events referencing objects the
        recipient may not see are dropped, and an event reduced to nothing is
        not sent.

        ADVISORY ONLY: correctness never depends on delivery. `Last-Event-ID`
        replays nothing; a reconnecting client refetches current state from the
        signals endpoint, which is the documented polling fallback. A client
        that cannot keep up is disconnected rather than buffered. Connection
        admission is bounded per principal, per organization, and instance-wide;
        a refusal is 429. Accepted streams begin with a jittered `retry:` hint.
      x-hikyo-class: tenant
      x-hikyo-operation: advisory.watch
      x-hikyo-formula: [read@project]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      responses:
        "200":
          description: An event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/instance/rotate-token-key:
    post:
      operationId: rotateTokenKey
      tags: [instance]
      summary: Rotate the root change-token key.
      description: |
        Mints a new root token key, retires the old one, and derives every
        subsequent change token under it.

        WHAT IT DOES NOT TOUCH: no snapshot's content, no revision number, and
        no pinned input revision moves. It cannot - a change token is never
        stored, it is derived at read from the live key over the snapshot's
        delivery manifest, so there is no cache to invalidate and nothing to
        resume after a crash.

        Every outstanding delivery cursor mismatches once and every consumer
        performs one full fetch. This is NOT a restart wave.

        It rides `rotate-dek`: the capability set is closed and names four
        rotation atoms for five rotation verbs, and the root token key is a
        tier-3 key alongside the DEKs.
      x-hikyo-class: instance
      x-hikyo-operation: crypto.rotate-token-key
      x-hikyo-formula: [rotate-dek@instance]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      responses:
        "200":
          description: The rotation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenKeyRotation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

components:
  securitySchemes:
    hikyoSession:
      type: http
      scheme: bearer
      bearerFormat: hik_1_cli_...
      description: |
        A CLI session artifact minted by an identity-protocol endpoint. The
        server trusts nothing inside the value: kind, principal, expiry and
        credential epoch are read from the row the verifier resolves to.

  parameters:
    OrgID:
      name: org
      in: path
      required: true
      description: Organisation identifier.
      schema:
        $ref: "#/components/schemas/ID"
    ProjectID:
      name: project
      in: path
      required: true
      description: Project identifier.
      schema:
        $ref: "#/components/schemas/ID"
    EnvironmentID:
      name: environment
      in: path
      required: true
      description: Environment identifier.
      schema:
        $ref: "#/components/schemas/ID"
    FolderID:
      name: folder
      in: path
      required: true
      description: Folder identifier.
      schema:
        $ref: "#/components/schemas/ID"
    ServiceAccountID:
      name: serviceAccount
      in: path
      required: true
      description: Service-account identifier.
      schema:
        $ref: "#/components/schemas/ID"
    CredentialID:
      name: credential
      in: path
      required: true
      description: Machine-credential identifier.
      schema:
        $ref: "#/components/schemas/ID"
    GrantPrincipal:
      name: principal
      in: query
      required: true
      description: The principal whose grant is being revoked.
      schema:
        $ref: "#/components/schemas/ID"
    GrantCapability:
      name: capability
      in: query
      required: true
      description: The capability atom being revoked.
      schema:
        $ref: "#/components/schemas/Capability"
    KeyID:
      name: key
      in: path
      required: true
      description: Key identifier - the immutable id, never the mutable name.
      schema:
        $ref: "#/components/schemas/ID"
    ValueKeyName:
      name: key
      in: path
      required: true
      description: |
        The key's NAME, not its id. Values are addressed the way an operator
        holds them - `values set DATABASE_URL` - and the id is server
        vocabulary that appears only in responses and audit records.
      schema:
        $ref: "#/components/schemas/KeyName"
    KeyGroupID:
      name: group
      in: path
      required: true
      description: Key group identifier.
      schema:
        $ref: "#/components/schemas/ID"
    ProviderSlug:
      name: provider
      in: path
      required: true
      description: Identity-provider slug.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
    ProviderSlugPath:
      name: slug
      in: path
      required: true
      description: Identity-provider slug.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
    IdentityID:
      name: id
      in: path
      required: true
      description: External identity identifier.
      schema:
        $ref: "#/components/schemas/ID"
    WebauthnCredentialID:
      name: id
      in: path
      required: true
      description: Enrolled passkey credential identifier.
      schema:
        $ref: "#/components/schemas/ID"
    ResetTargetPrincipal:
      name: principal
      in: path
      required: true
      description: The target principal whose credential is being reset.
      schema:
        $ref: "#/components/schemas/ID"
    FederationIssuerID:
      name: issuer
      in: path
      required: true
      description: |
        Federation issuer identifier. It is the server-minted id, not the issuer
        URL: a URL in a path segment would have to be escaped, and an escaping
        rule on a byte-exact identity is a canonicalization step waiting to
        happen.
      schema:
        $ref: "#/components/schemas/ID"
    DeliveryCursor:
      name: cursor
      in: query
      required: false
      description: |
        The opaque cursor a previous fetch returned. Absent means a full
        authorized delivery. A cursor is never parsed by the caller and never
        constructed by one: the server recomputes it for the state it is about to
        serve and compares.
      schema:
        type: string
        maxLength: 128
    ScimBindingID:
      name: binding
      in: path
      required: true
      description: SCIM binding identifier.
      schema:
        $ref: "#/components/schemas/ID"
    ScimCount:
      name: count
      in: query
      required: false
      description: |
        Desired page size. It is a REQUEST: a value above this provider's bound
        is answered with the bound rather than refused.

        Typed `string` and unconstrained for the same reason as `startIndex`.
      schema:
        type: string
    ScimFilter:
      name: filter
      in: query
      required: false
      description: |
        An RFC 7644 filter, closed to `attribute eq "value"` over the four
        probes Okta and Entra actually issue. Anything else is `invalidFilter`.

        Deliberately unconstrained HERE. Contract validation runs BEFORE the
        provisioning credential is authenticated, so any constraint declared on
        a SCIM wire parameter answers an unauthenticated caller with a Hikyo 400
        instead of the uniform 401 — telling them something about their request
        before they have proved they may ask. Every bound and every grammar
        refusal for this parameter lives in the protocol layer, after
        authentication, where it is rendered as an RFC 7644 error.
      schema:
        type: string
    ScimResourceID:
      name: id
      in: path
      required: true
      description: |
        A server-minted resource identifier. The identity provider can only
        reference ids this server minted.
      schema:
        $ref: "#/components/schemas/ID"
    ScimSortBy:
      name: sortBy
      in: query
      required: false
      description: |
        Present only so its presence can be REFUSED by name with 501. Sorting
        is advertised absent in ServiceProviderConfig and is not
        half-implemented. Unconstrained: see `filter`.
      schema:
        type: string
    ScimSortOrder:
      name: sortOrder
      in: query
      required: false
      description: |
        Present only so its presence can be REFUSED by name with 501, exactly
        like `sortBy`. Refusing one and ignoring the other would be the
        half-implementation the ADR forbids. Unconstrained: see `filter`.
      schema:
        type: string
    ScimStartIndex:
      name: startIndex
      in: query
      required: false
      description: |
        1-based index of the first result; a value below 1 is read as 1, per
        RFC 7644 §3.4.2.4.

        Typed `string`, not `integer`, and carrying no `minimum`: see the note
        on `filter`. `minimum: 1` made `startIndex=0` a pre-authentication 400,
        which is both an unauthenticated refusal and a contradiction of the
        RFC's own "read as 1". Parsing and clamping happen in the protocol
        layer after authentication.
      schema:
        type: string

  responses:
    BadRequest:
      description: |
        The request does not satisfy this document. Decided before any tenant
        resolution, so `detail` leaks nothing about tenancy — it is the only
        error response permitted to carry one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: |
        No usable authentication artifact was presented. Uniform: absent,
        malformed, unknown, expired, revoked and epoch-superseded artifacts
        are indistinguishable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        Either the principal does not hold the operation's formula at instance
        scope — instance-class operations have no tenant object whose
        nonexistence could be mimicked, so the probe contract there is grant
        refusal, not tenancy — or the principal DOES hold it and the acting
        session's assurance is inadequate for an MFA-mandatory operation.

        The second case is why two tenant-scoped operations (`renameOrg`,
        `deleteOrg`) declare this status: their formula atom `instance-config`
        is MFA-mandatory, and the refusal fires only AFTER the grant check
        succeeded. A caller who reaches it can already reach the object, so
        naming the step-up discloses nothing the uniform 404 was protecting —
        and hiding it would tell a capability holder the object is missing.
        Grant refusal on a tenant-scoped operation is always the 404.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: |
        The addressed object does not exist **or** the principal may not reach
        it — indistinguishable by design, byte-identical in status and body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        The caller is authorized, but the current state refuses: a name already
        in use among live siblings, a parent that still has children (deletes
        never cascade), or a structural bound reached (`limit_exceeded`, whose
        message names the bound). Decided after authorization, so it discloses
        nothing a caller could not already read.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: |
        The instance-wide admission budget or a per-source limit is
        exhausted. Uniform on every path, with no unbounded work performed.
      headers:
        Retry-After:
          required: true
          description: Whole seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: An unexpected server fault. The cause is logged, never returned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ID:
      type: string
      description: A prefixed UUIDv7, e.g. `org_0198…`.
      minLength: 3
      maxLength: 64
      pattern: "^[a-z]{2,8}_[0-9a-fA-F-]{36}$"

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 UTC, microsecond precision.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: |
                Fixed per code. Never derived from the request, so two
                refusals of the same class are byte-identical.
            detail:
              type: [string, "null"]
              description: |
                Present only on `bad_request`, where it names the offending
                request member. `null` and absent are equivalent; every other
                error code omits the member entirely.

    ErrorCode:
      type: string
      description: Closed set — never grows. Clients branch on this, not on prose.
      enum:
        - bad_request
        - unauthenticated
        - forbidden
        - not_found
        - conflict
        - limit_exceeded
        - too_many_requests
        - internal

    Meta:
      type: object
      description: |
        An exact closed allowlist. `additionalProperties: false` is the
        allowlist's teeth: a field added here is a visible spec change, not a
        quiet leak of instance configuration to unauthenticated callers.
      additionalProperties: false
      required: [server_version, api_revision, protocol_capabilities]
      properties:
        server_version:
          type: string
          description: The build's version string; `dev` for unreleased builds.
        api_revision:
          type: integer
          minimum: 1
          description: |
            This server's API revision. A client refuses an operation whose
            `x-hikyo-min-revision` exceeds it, naming the server version — a
            loud refusal, never a silent misbehave.
        protocol_capabilities:
          type: array
          description: |
            Which authentication protocol flows this instance serves. `login`
            needs this before any session exists.
          items:
            $ref: "#/components/schemas/ProtocolCapability"

    ProtocolCapability:
      type: string
      description: |
        OPEN enum: an instance may advertise a flow this client has never
        heard of, and every generated consumer must preserve and tolerate the
        unknown value rather than reject the response.
      x-extensible-enum:
        - local-password
        - loopback-handoff
        - device-code
        - oidc
        - saml
        - webauthn

    EstablishCredentialRequest:
      type: object
      additionalProperties: false
      required: [authority, password]
      properties:
        authority:
          type: string
          description: |
            The single-use credential-establishment authority, exactly as
            delivered. Never logged, never audited, never echoed.
          minLength: 16
          maxLength: 256
        password:
          type: string
          description: |
            The initial credential. Minimum length 12, no composition rules,
            no forced rotation (NIST SP 800-63B shape); checked against a
            bundled common-password list at set time only, never at login.
          minLength: 12
          maxLength: 1024

    LocalLoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 256
        password:
          type: string
          minLength: 1
          maxLength: 1024
        artifact:
          type: string
          enum: [cli, browser]
          default: cli
          description: |
            Which session artifact to mint. Omitted or `cli` mints a CLI
            session whose token is returned in the body. `browser` mints a
            browser session delivered ONLY on the `__Host-hikyo` cookie, with
            its synchronizer token on the `__Host-hikyo-csrf` cookie; the body
            then carries no token at all. The two artifacts have distinct
            lifetimes, distinct CSRF contracts and distinct revocation
            surfaces, so the caller states which one it is asking for rather
            than the server guessing from a header.

    LoginResult:
      type: object
      required: [session, principal]
      properties:
        session_token:
          type: string
          description: |
            The bearer value, returned exactly once. A replayable credential:
            cookie attributes constrain browsers, not an attacker holding the
            value, which is why lifetimes are short and revocation is a
            delete. OMITTED for a browser-artifact session: that token is
            delivered ONLY on the `__Host-hikyo` HttpOnly cookie so injected
            same-origin script cannot read it. A CLI-artifact session, which has
            no cookie channel, still carries it here.
        session:
          $ref: "#/components/schemas/Session"
        principal:
          $ref: "#/components/schemas/Principal"

    WhoAmI:
      type: object
      required: [session, principal]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        principal:
          $ref: "#/components/schemas/Principal"

    TotpEnrolStartRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          description: |
            The account-security proof: the pre-existing password. Verified
            before a pending seed is staged; never logged, never echoed.
          minLength: 1
          maxLength: 1024

    TotpEnrolStartResult:
      type: object
      additionalProperties: false
      required: [otpauth_uri]
      properties:
        otpauth_uri:
          type: string
          description: |
            The `otpauth://totp/...` provisioning URI, returned exactly once.
            The seed is never re-retrievable.

    TotpCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          description: A TOTP code from the enrolled authenticator.
          minLength: 6
          maxLength: 10

    TotpReauthRequest:
      type: object
      additionalProperties: false
      required: [environment_id, code]
      description: |
        A disclosure reauthentication by TOTP. `environment_id` is what the
        window is opened OVER — the reveal guard is per environment, so a
        window on staging authorizes nothing in production.
      properties:
        environment_id:
          $ref: "#/components/schemas/ID"
        code:
          type: string
          description: A TOTP code from the enrolled authenticator.
          minLength: 6
          maxLength: 10

    TotpProofRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          description: The account-security proof for removing the factor.
          minLength: 1
          maxLength: 1024

    RecoveryProofRequest:
      type: object
      additionalProperties: false
      required: [proof]
      properties:
        proof:
          type: string
          description: |
            The account-security proof: the confirmed TOTP code where one
            stands, else the password.
          minLength: 1
          maxLength: 1024

    RecoveryCodesResult:
      type: object
      required: [recovery_codes, login]
      properties:
        recovery_codes:
          type: array
          description: The plaintext single-use codes, displayed once and never again.
          items:
            type: string
        login:
          $ref: "#/components/schemas/LoginResult"

    RecoveryBeginRequest:
      type: object
      additionalProperties: false
      required: [username, code]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 256
        code:
          type: string
          minLength: 1
          maxLength: 256

    RecoveryBeginResult:
      type: object
      additionalProperties: false
      required: [authority, expires_at]
      properties:
        authority:
          type: string
          description: |
            The single-use credential-establishment authority, returned once.
            It creates no session: establish a password with it, then log in.
        expires_at:
          $ref: "#/components/schemas/Timestamp"

    CredentialResetResult:
      type: object
      additionalProperties: false
      required: [authority, expires_at]
      properties:
        authority:
          type: string
          description: |
            The single-use credential-establishment authority for the target,
            returned once. It creates no session and may only ever establish a
            password; hand it to the target out of band.
        expires_at:
          $ref: "#/components/schemas/Timestamp"

    Session:
      type: object
      required: [id, artifact, created_at, idle_expires_at, absolute_expires_at, assurance]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        artifact:
          $ref: "#/components/schemas/SessionArtifact"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        idle_expires_at:
          $ref: "#/components/schemas/Timestamp"
        absolute_expires_at:
          $ref: "#/components/schemas/Timestamp"
        assurance:
          $ref: "#/components/schemas/Assurance"

    SessionArtifact:
      type: string
      description: |
        OPEN enum: human sessions are per-client-class artifacts and new
        classes are additive. A browser cookie's attributes protect nothing on
        a non-browser client, and conflating the two hides which artifact was
        actually used.
      x-extensible-enum:
        - cli
        - browser

    Assurance:
      type: object
      description: |
        How **this session** authenticated — not what the account owns.
        Authorization of an MFA-mandatory capability consults this record at
        the same chokepoint as `authorize()`, in the same transaction,
        uncached.
      required: [method, factors, authenticated_at]
      properties:
        method:
          $ref: "#/components/schemas/AuthMethod"
        factors:
          type: array
          description: The factor classes actually presented in this session.
          items:
            $ref: "#/components/schemas/FactorClass"
        authenticated_at:
          $ref: "#/components/schemas/Timestamp"
        ceremony_id:
          type: [string, "null"]
          description: |
            The factor ceremony this session's assurance came from, where one
            occurred. `null` for a single-factor password login.

    AuthMethod:
      type: string
      description: |
        OPEN enum — `oidc:<issuer>` and `saml:<entityID>` values are
        instance-specific by construction.
      x-extensible-enum:
        - local-password
        - local-passkey

    FactorClass:
      type: string
      description: OPEN enum — new factor classes are additive.
      x-extensible-enum:
        - password
        - totp
        - webauthn
        - recovery-code

    Principal:
      type: object
      required: [id, kind]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        kind:
          $ref: "#/components/schemas/PrincipalKind"
        display_name:
          type: [string, "null"]
          description: For display only. Never a linking key, at any point, for any provider.

    PrincipalKind:
      type: string
      description: Closed set — the human/machine distinction is structural in audit attribution.
      enum: [human, machine]

    CreateOrgRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        active:
          type: boolean
          default: true
        metadata:
          type: [object, "null"]
          description: |
            Free-form operator metadata. `null` and absent both mean "no
            metadata"; the round-trip of absent/null/value is fixture-pinned
            through both the Go and the TypeScript consumer.

    Org:
      type: object
      required: [id, name, active, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
        active:
          type: boolean
        metadata:
          type: [object, "null"]
        created_at:
          $ref: "#/components/schemas/Timestamp"

    OrgList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Org"
        count:
          type: integer
          minimum: 0
          description: Total rows matching, which for an unpaged list equals `items` length.

    MyOrg:
      type: object
      additionalProperties: false
      required: [id, name]
      description: |
        An organisation as a navigation destination: what the caller needs to
        show it and route to it, and nothing else. Deliberately narrower than
        `Org` — `metadata` and `active` are operator-set state that belongs to
        `getOrg`, which authorizes; a member listing does not.
      properties:
        id:
          $ref: "#/components/schemas/ID"
        name:
          type: string

    MyOrgList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MyOrg"
        count:
          type: integer
          minimum: 0
          description: Total rows matching, which for an unpaged list equals `items` length.

    EntityName:
      type: string
      description: |
        A display name for an organisation, project or environment. Identity is
        the immutable id, so this is a label and a rename never breaks a
        reference. The 128-byte bound is the one the organisation contract has
        carried since the first slice, adopted for every entity so there is one
        number rather than four; no ADR fixes a per-entity name length. The
        grammar itself (non-empty, no control characters, no surrounding
        whitespace) is enforced in the domain rather than restated as a pattern
        here — two grammars would be two things to keep in sync.

        **The bound is 128 UTF-8 BYTES, and the server is authoritative.**
        `maxLength` below counts Unicode code points, which is the only length
        JSON Schema can express, so a name of 100 emoji satisfies this schema
        and is still refused by the server with `bad_request`. Clients that want
        to pre-validate must measure the UTF-8 encoding, not the string length.
      minLength: 1
      maxLength: 128

    RenameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/EntityName"

    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/EntityName"

    Project:
      type: object
      required: [id, org_id, name, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        org_id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"

    ProjectList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        count:
          type: integer
          minimum: 0
          description: Total rows matching, which for an unpaged list equals `items` length.

    CreateEnvironmentRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/EntityName"

    CloneEnvironmentRequest:
      type: object
      additionalProperties: false
      required: [name, source_environment_id]
      properties:
        name:
          $ref: "#/components/schemas/EntityName"
        source_environment_id:
          $ref: "#/components/schemas/ID"

    ClonedEnvironment:
      type: object
      required: [environment, copied, uncopied_secrets]
      properties:
        environment:
          $ref: "#/components/schemas/Environment"
        copied:
          type: array
          description: The key names whose values the clone carried over.
          items:
            $ref: "#/components/schemas/KeyName"
        uncopied_secrets:
          type: array
          description: |
            The `secret` key names the source-material gate blocked. They land
            `absent` in the new environment - never silently, which is why
            they are enumerated here.
          items:
            $ref: "#/components/schemas/KeyName"

    PendingChange:
      type: object
      description: |
        One draft in the caller's own working state. `version_id` is the
        IMMUTABLE id a selective publish names; editing the same cell mints a
        new one and collects this row rather than mutating it.

        It never carries the staged value. A draft holds real material and that
        material is reveal-gated exactly as a published one is.
      required: [version_id, key_id, name, classification, operation, staged_from_revision, created_at]
      additionalProperties: false
      properties:
        version_id:
          $ref: "#/components/schemas/ID"
        key_id:
          $ref: "#/components/schemas/ID"
        name:
          $ref: "#/components/schemas/KeyName"
        classification:
          $ref: "#/components/schemas/KeyClassification"
        operation:
          type: string
          description: What publishing this draft does to the cell.
          enum: [set, unset]
        staged_from_revision:
          type: integer
          format: int64
          description: |
            The environment's published revision when the edit was staged.
            Provenance a client shows; the freshness check is per entry.
        created_at:
          type: string
          format: date-time
    PublishRequest:
      type: object
      required: [version_ids]
      additionalProperties: false
      properties:
        version_ids:
          type: array
          minItems: 1
          uniqueItems: true
          description: |
            The pending-change version ids to commit. Naming an id the caller
            does not own, or one that has been superseded or already published,
            is refused loud rather than resolved to whatever the owner typed
            since.
          items:
            $ref: "#/components/schemas/ID"
    PublishResult:
      type: object
      required: [published, closed_in, environments]
      additionalProperties: false
      properties:
        published:
          type: array
          description: Every version id that committed, closure included.
          items:
            $ref: "#/components/schemas/ID"
        closed_in:
          type: array
          description: |
            The version ids key-group closure pulled in beyond what the caller
            named, so the caller can tell what it asked for from what the
            coupling required.
          items:
            $ref: "#/components/schemas/ID"
        environments:
          type: array
          items:
            $ref: "#/components/schemas/PublishedEnvironment"
    PublishedEnvironment:
      type: object
      required: [environment_id, revision, schema_revision, change_token, changed_keys]
      additionalProperties: false
      properties:
        environment_id:
          $ref: "#/components/schemas/ID"
        revision:
          type: integer
          format: int64
        schema_revision:
          type: integer
          format: int64
          description: The pinned schema revision this snapshot was validated at.
        change_token:
          type: string
          description: |
            The keyed, versioned change token for this snapshot. Non-secret by
            construction: it is an HMAC under a per-scope key, so it is
            unforgeable and un-invertible, which is why it may travel in pod
            annotations and logs.
        changed_keys:
          type: array
          items:
            $ref: "#/components/schemas/ChangedKey"
    ChangedKey:
      type: object
      description: |
        One lineage row. It carries a key id, the key's name at that revision
        and the transition - and nothing derived from a value.
      required: [key_id, name, change]
      additionalProperties: false
      properties:
        key_id:
          $ref: "#/components/schemas/ID"
        name:
          $ref: "#/components/schemas/KeyName"
        change:
          type: string
          enum: [added, edited, removed]
    RevisionList:
      type: object
      required: [items, count]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Revision"
        count:
          type: integer
    Revision:
      type: object
      required: [revision, schema_revision, published_by, published_at, changed_keys]
      additionalProperties: false
      properties:
        revision:
          type: integer
          format: int64
        schema_revision:
          type: integer
          format: int64
        published_by:
          $ref: "#/components/schemas/ID"
        published_at:
          type: string
          format: date-time
        changed_keys:
          type: array
          items:
            $ref: "#/components/schemas/ChangedKey"
    RevisionDetail:
      type: object
      required: [revision, schema_revision, published_by, published_at, changed_keys, change_token, keys]
      additionalProperties: false
      properties:
        revision:
          type: integer
          format: int64
        schema_revision:
          type: integer
          format: int64
        published_by:
          $ref: "#/components/schemas/ID"
        published_at:
          type: string
          format: date-time
        changed_keys:
          type: array
          items:
            $ref: "#/components/schemas/ChangedKey"
        change_token:
          type: string
        keys:
          type: array
          description: |
            The delivered key set of THIS revision, under the schema revision
            it pinned. Names and classifications only; values live behind the
            export verb and its formula.
          items:
            $ref: "#/components/schemas/SnapshotKey"
    SnapshotKey:
      type: object
      required: [key_id, name, classification]
      additionalProperties: false
      properties:
        key_id:
          $ref: "#/components/schemas/ID"
        name:
          $ref: "#/components/schemas/KeyName"
        classification:
          $ref: "#/components/schemas/KeyClassification"
    EnvironmentSignals:
      type: object
      required: [environment_id, revision, cells]
      additionalProperties: false
      properties:
        environment_id:
          $ref: "#/components/schemas/ID"
        revision:
          type: integer
          format: int64
          description: The environment's current published revision, 0 when never materialized.
        cells:
          type: array
          items:
            $ref: "#/components/schemas/CellSignal"
    CellSignal:
      type: object
      required: [key_id, name, classification, pending_by_others]
      additionalProperties: false
      properties:
        key_id:
          $ref: "#/components/schemas/ID"
        name:
          $ref: "#/components/schemas/KeyName"
        classification:
          $ref: "#/components/schemas/KeyClassification"
        pending_version_id:
          $ref: "#/components/schemas/ID"
        pending_operation:
          type: string
          enum: [set, unset]
        pending_by_others:
          type: boolean
          description: |
            At least one OTHER principal holds a draft here. Write-presence and
            nothing more: no id, no owner, no operation.
        changed_in_revision:
          type: integer
          format: int64
          description: Set to the environment's LATEST revision when this cell changed in
            it, absent otherwise. This is the revision ADR's "recently
            changed" signal, which names only the last published revision --
            it is not a per-cell last-change history; older changes live in
            the revision list.
    ExportValuesRequest:
      type: object
      additionalProperties: false
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: The revision to export; omitted means the latest.
        reveal:
          type: boolean
          description: |
            Ask for `secret` plaintext. Without it a `secret` key reports
            write-presence and no value; `config` values are returned either
            way, because classification IS the sensitivity boundary.
    ExportedValues:
      type: object
      required: [revision, items, count]
      additionalProperties: false
      properties:
        revision:
          type: integer
          format: int64
          description: The revision actually served.
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExportedValue"
        count:
          type: integer
    ExportedValue:
      type: object
      required: [name, classification, revealed]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/KeyName"
        classification:
          $ref: "#/components/schemas/KeyClassification"
        revealed:
          type: boolean
        value:
          type: string
          description: Present only when `revealed` is true.
    TokenKeyRotation:
      type: object
      required: [token_key_version]
      additionalProperties: false
      properties:
        token_key_version:
          type: integer
          format: int64
          description: |
            The new root token key version. Operator bookkeeping only - the
            change token's public contract carries the SCHEME version, never
            the key version, because a consumer that could tell key versions
            apart could tell a rotation from a content change.
    ValueCell:
      type: object
      description: |
        One `(key, environment)` cell.

        PRESENCE IS THE SINGLE BOOLEAN `set`. That is the whole presence
        model: there is no mode, no enum with a third member, and nothing
        named `masked` anywhere in this contract - the flat-model ADR deleted
        that state with the inheritance it existed to explain. A cell that is
        not `set` carries no value from any source.
      required: [key_id, name, classification, set, revealed]
      properties:
        key_id:
          $ref: "#/components/schemas/ID"
        name:
          $ref: "#/components/schemas/KeyName"
        classification:
          $ref: "#/components/schemas/KeyClassification"
        set:
          type: boolean
          description: |
            `true` is the `set` state, `false` is `absent`. Those are the only
            two states there are.
        revealed:
          type: boolean
          description: |
            Whether `value` carries plaintext. It exists so a caller can tell
            an empty value the operator actually set from a `secret` they are
            not authorized to read - two cases that would otherwise both look
            like an absent `value` member.
        value:
          type: string
          description: |
            Present only where the reader was authorized to see it: `config`
            under `read`, `secret` under `read` AND `reveal`.
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        updated_by:
          type: string
          description: The principal whose act produced this occurrence.

    ValueList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ValueCell"
        count:
          type: integer
          minimum: 0

    SetValueRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
          maxLength: 65536
          description: |
            The plaintext. It is validated against the key's declaration
            before it commits, and stored sealed under the project data key
            with associated data binding it to this row alone.

    DeclareValuesRequest:
      type: object
      additionalProperties: false
      required: [key, environment_ids, value]
      properties:
        key:
          $ref: "#/components/schemas/KeyName"
        environment_ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ID"
        value:
          type: string
          maxLength: 65536

    CopyValuesRequest:
      type: object
      additionalProperties: false
      required: [source_environment_id, keys, destination_environment_ids]
      properties:
        source_environment_id:
          $ref: "#/components/schemas/ID"
        keys:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          description: |
            The keys to copy, by name. Explicit: an empty list quietly meaning
            "everything" is how a mistyped bulk apply becomes an incident, so
            it is refused instead. Naming a key twice is refused: it is one
            logical cell requested twice.
          items:
            $ref: "#/components/schemas/KeyName"
        destination_environment_ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ID"
        confirm_protected:
          type: boolean
          default: false
          description: |
            The protected-environment confirmation. A protected destination
            refuses the copy without it, naming the environment.

    CopyValuesResult:
      type: object
      required: [copied]
      properties:
        copied:
          type: array
          items:
            type: object
            required: [key, destination_environment_id]
            properties:
              key:
                $ref: "#/components/schemas/KeyName"
              destination_environment_id:
                $ref: "#/components/schemas/ID"

    ValueDiff:
      type: object
      required: [items, left_environment_id, right_environment_id]
      properties:
        left_environment_id:
          $ref: "#/components/schemas/ID"
        right_environment_id:
          $ref: "#/components/schemas/ID"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ValueDiffRow"

    RevealDiffRequest:
      type: object
      additionalProperties: false
      required: [left, right]
      properties:
        left:
          $ref: "#/components/schemas/ID"
        right:
          $ref: "#/components/schemas/ID"

    ValueDiffRow:
      type: object
      required: [key_id, name, classification, left, right]
      properties:
        key_id:
          $ref: "#/components/schemas/ID"
        name:
          $ref: "#/components/schemas/KeyName"
        classification:
          $ref: "#/components/schemas/KeyClassification"
        left:
          $ref: "#/components/schemas/ValueCell"
        right:
          $ref: "#/components/schemas/ValueCell"
        equal:
          type: boolean
          description: |
            ABSENT where the comparison could not be made without disclosing
            something the caller may not see - both sides `set` with at least
            one unreadable. Whether two secrets match is itself material, so it
            is not answered as `false` either.

    Environment:
      type: object
      description: |
        An environment carries NO `base` pointer and no defaults layer, here or
        anywhere: the flat-model ADR deleted both, and every value is explicit
        per environment.
      required: [id, org_id, project_id, name, display_order, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        org_id:
          $ref: "#/components/schemas/ID"
        project_id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
        display_order:
          type: integer
          minimum: 0
          description: |
            The environment's position in the project's display order. A real
            mutable property, rewritten as a whole set by
            `PUT .../environments/order`; ties break on name.
        created_at:
          $ref: "#/components/schemas/Timestamp"

    EnvironmentList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Environment"
        count:
          type: integer
          minimum: 0
          description: Total rows matching, which for an unpaged list equals `items` length.

    EnvironmentOrderRequest:
      type: object
      additionalProperties: false
      required: [environment_ids]
      properties:
        environment_ids:
          type: array
          description: |
            Every environment in the project, exactly once, in the order they
            should display. The whole set — not a subset — so no transaction can
            leave two environments sharing a position.
          # A project with no environments has the empty list as its exact
          # whole set, so `[]` is a legal no-op rather than a schema error —
          # the service accepts it and the schema must agree, or the two layers
          # disagree about what "the whole set" means.
          minItems: 0
          # The upper bound IS the environment-count cap: a project cannot hold
          # more environments than this, so it cannot legitimately order more.
          maxItems: 50
          items:
            $ref: "#/components/schemas/ID"

    FolderPath:
      type: string
      description: |
        A slash-separated namespace: no leading or trailing separator, no empty
        segment, no `.` or `..` segment, at most 32 segments. Organizational
        only — no grant is scoped to a folder and no value attaches to one.

        **Two bounds the schema cannot express, both server-authoritative and
        both measured in UTF-8 BYTES:** the whole path is at most 256 bytes
        (`maxLength` below counts code points), and EACH SEGMENT is at most 128
        bytes — the same bound entity names carry. A 129-character ASCII segment
        satisfies this schema and is refused with `bad_request`.
      minLength: 1
      maxLength: 256

    CreateFolderRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          $ref: "#/components/schemas/FolderPath"

    RenameFolderRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          $ref: "#/components/schemas/FolderPath"

    Folder:
      type: object
      required: [id, org_id, project_id, path, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        org_id:
          $ref: "#/components/schemas/ID"
        project_id:
          $ref: "#/components/schemas/ID"
        path:
          $ref: "#/components/schemas/FolderPath"
        created_at:
          $ref: "#/components/schemas/Timestamp"

    FolderList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Folder"
        count:
          type: integer
          minimum: 0
          description: Total rows matching, which for an unpaged list equals `items` length.

    ServiceAccountKind:
      type: string
      description: |
        The closed set a service account may be created with. Declared at
        creation and IMMUTABLE afterwards.
      enum: [workload, automation]

    CredentialKind:
      type: string
      description: |
        How a credential authenticates its service account. The discriminator
        exists before a second kind does, so adding one is a new row type
        rather than a schema change.
      enum: [hikyo-token, oidc-federation]

    CredentialLifetime:
      type: string
      description: |
        `indefinite` is a VALUE, not a large number: it is unreachable by
        raising the instance ceiling, and is admitted only under a separate,
        default-off instance opt-in.
      enum: [finite, indefinite]

    CreateServiceAccountRequest:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        kind:
          $ref: "#/components/schemas/ServiceAccountKind"

    ServiceAccount:
      type: object
      additionalProperties: false
      required: [id, principal_id, name, kind, created_at, created_by, live_credentials]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        principal_id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          maxLength: 64
        kind:
          $ref: "#/components/schemas/ServiceAccountKind"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        created_by:
          $ref: "#/components/schemas/ID"
        live_credentials:
          type: integer
          minimum: 0
          description: How many of its credentials currently authenticate.

    ServiceAccountList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServiceAccount"
        count:
          type: integer
          minimum: 0

    MachineCredential:
      type: object
      additionalProperties: false
      required: [id, kind, lifetime, created_at, created_by, expiring_soon]
      description: |
        Metadata only. There is deliberately no value property: a credential
        value is displayed exactly once, at mint, and is never retrievable
        afterwards.

        A row of kind `oidc-federation` carries no `prefix_hint` — a binding has
        no minted value to hint at — and carries the binding members instead.
      properties:
        id:
          $ref: "#/components/schemas/ID"
        kind:
          $ref: "#/components/schemas/CredentialKind"
        prefix_hint:
          type: string
          maxLength: 32
          description: |
            The non-secret leading slice of the minted value - the grammar
            prefix plus a few body characters, enough to tell two live
            credentials apart and far short of anything a search can narrow.
            Absent for an `oidc-federation` row.
        issuer:
          type: string
          maxLength: 512
          description: "`oidc-federation` only: the byte-exact issuer this binding trusts."
        subject:
          type: string
          maxLength: 512
          description: "`oidc-federation` only: the byte-exact `sub` it names."
        audience:
          type: string
          maxLength: 512
          description: "`oidc-federation` only: the audience it accepts, never the issuer's default."
        required_claims:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/FederatedClaimPin"
          description: "`oidc-federation` only: every pinned claim, all of which validation requires."
        reactivated_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: |
            `oidc-federation` only, and null unless this binding has been through
            a restore. When set, the binding permanently refuses any token whose
            `iat` is not strictly after this instant plus the maximum accepted
            positive clock skew.
        lifetime:
          $ref: "#/components/schemas/CredentialLifetime"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        created_by:
          $ref: "#/components/schemas/ID"
        revoked_at:
          $ref: "#/components/schemas/Timestamp"
        last_used_at:
          $ref: "#/components/schemas/Timestamp"
        expiring_soon:
          type: boolean
          description: |
            The in-product expiry warning, computed rather than stored - a
            stored flag would be stale the moment the clock moved past it.

    MachineCredentialList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MachineCredential"
        count:
          type: integer
          minimum: 0

    MintCredentialRequest:
      type: object
      additionalProperties: false
      description: |
        The zero request asks for the finite default, which is the rule that
        the easy path is bounded and a long-lived credential is a typed choice
        someone made.
      properties:
        indefinite:
          type: boolean
          description: |
            Selects the distinct typed lifetime. A separate property rather
            than a sentinel duration, because `indefinite` must be
            unreachable by raising any ceiling. Naming it together with
            `lifetime_seconds` is refused rather than resolved by precedence:
            a silent precedence rule on a credential is exactly the quiet
            ambiguity fail-loud exists to prevent.
        lifetime_seconds:
          type: integer
          minimum: 1
          description: Requested finite lifetime; absent means the instance default.

    MintCredentialResult:
      type: object
      additionalProperties: false
      required: [value, credential, clamped]
      properties:
        value:
          type: string
          description: |
            The credential value, returned EXACTLY ONCE to exactly one caller.
            No other route in this contract returns it.
        credential:
          $ref: "#/components/schemas/MachineCredential"
        clamped:
          type: boolean
          description: |
            True when the instance ceiling shortened what was asked for, so
            the caller can say so rather than let the operator discover it
            when the credential dies early.

    IssuerType:
      type: string
      description: |
        The federation issuer's platform. It is DECLARED rather than inferred
        from the issuer URL, because the per-platform binding rules differ — a
        Forgejo or GitHub Actions binding MUST pin `event_name`, a Kubernetes one
        has no such claim — and inferring the type from a URL would let renaming
        a deployment change the security rules that apply to it.
      enum: [kubernetes, forgejo, github-actions]

    JWKSMode:
      type: string
      description: |
        Where the issuer's signing keys come from. `discovery` is the default:
        keys are fetched and cached with a bounded staleness window. `static` is
        the configured alternative for air-gapped installations and for
        deployments whose issuer discovery endpoint this instance cannot reach —
        deliberately not the default, because a static-only installation breaks
        silently on the day someone rotates the issuer's keys.
      enum: [discovery, static]

    FederationIssuer:
      type: object
      additionalProperties: false
      required:
        [id, issuer, issuer_type, jwks_mode, refused_audiences, created_at, created_by, live_bindings]
      description: |
        One instance-scoped issuer configuration. There is deliberately no
        `static_jwks` property on the READ shape: the document is configuration
        an operator supplied and can re-supply, nothing needs it back, and a read
        surface that returned it would carry a key document for no reason.
      properties:
        id:
          $ref: "#/components/schemas/ID"
        issuer:
          type: string
          maxLength: 512
          description: |
            The byte-exact `iss`. Nothing folds case, resolves the URL or strips
            a trailing slash: OpenID Connect defines `iss` as case-sensitive, so
            any normalization could merge two distinct external issuers into one
            configuration.
        issuer_type:
          $ref: "#/components/schemas/IssuerType"
        jwks_mode:
          $ref: "#/components/schemas/JWKSMode"
        refused_audiences:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
            maxLength: 512
          description: |
            The issuer's DEFAULT audiences, which no binding may name and which
            no token may carry. At least one is required: a Kubernetes API-server
            audience is whatever that cluster was configured with and is not
            derivable, so an empty list would silently accept the audience that
            must be refused.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        created_by:
          $ref: "#/components/schemas/ID"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        updated_by:
          $ref: "#/components/schemas/ID"
        live_bindings:
          type: integer
          minimum: 0
          description: |
            How many bindings name this issuer, LIVE OR HISTORICAL, so an operator
            sees the blast radius before attempting a delete — which is refused
            while any remain. Revoked bindings count: erasing the issuer a past
            binding trusted erases what it trusted, and the foreign key would
            refuse the delete anyway with a driver message instead of a reason.

    FederationIssuerList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FederationIssuer"
        count:
          type: integer
          minimum: 0

    CreateFederationIssuerRequest:
      type: object
      additionalProperties: false
      required: [issuer, issuer_type, jwks_mode, refused_audiences]
      properties:
        issuer:
          type: string
          minLength: 9
          maxLength: 512
          description: |
            The byte-exact `iss`, `https://` only. Discovery and JWKS are fetched
            from this URL, so an `http` issuer would rest the instance's whole
            federation trust on whoever holds the network path.
        issuer_type:
          $ref: "#/components/schemas/IssuerType"
        jwks_mode:
          $ref: "#/components/schemas/JWKSMode"
        static_jwks:
          type: string
          maxLength: 1048576
          description: |
            The JWKS document, required under `static` mode and refused under
            `discovery`. The pairing is total: a document stored but unused is a
            key set nobody rotates.
        refused_audiences:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
            maxLength: 512

    UpdateFederationIssuerRequest:
      type: object
      additionalProperties: false
      required: [jwks_mode, refused_audiences]
      description: |
        The MUTABLE half only. `issuer` and `issuer_type` are absent on purpose:
        changing either would silently re-point every binding underneath at a
        different external authority, which is a replacement, not an edit.
      properties:
        jwks_mode:
          $ref: "#/components/schemas/JWKSMode"
        static_jwks:
          type: string
          maxLength: 1048576
        refused_audiences:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
            maxLength: 512

    FederatedClaimPin:
      type: object
      additionalProperties: false
      required: [claim]
      description: |
        One pinned claim, as a DISCRIMINATED scalar rather than a free-form JSON
        value. Exactly one of `string_value`, `number_value` or `bool_value` is
        set, and that is what makes "a string is never folded to a number" true
        at the wire boundary rather than only inside the validator:
        `repository_id: 123` and `repository_id: "123"` are two different
        requests that cannot be mistaken for one another, and a 64-bit repository
        id survives without passing through a float.

        A pin naming none or several values is refused rather than resolved by
        precedence.
      properties:
        claim:
          type: string
          minLength: 1
          maxLength: 128
        string_value:
          type: string
          maxLength: 512
        number_value:
          type: integer
          format: int64
        bool_value:
          type: boolean

    CreateBindingRequest:
      type: object
      additionalProperties: false
      required: [issuer, subject, audience, required_claims]
      description: |
        A binding names exactly one service account, matched byte-for-byte on
        `(issuer, subject)`. There are no wildcards, no namespace patterns, no
        path prefixes, no case folding and no JIT provisioning: a pattern rule
        such as "any ServiceAccount in namespace prod" would hand a Hikyo
        principal to anyone holding `create serviceaccount` in that namespace, a
        far wider group than cluster-admin.
      properties:
        issuer:
          type: string
          maxLength: 512
          description: The byte-exact `iss` of a configured issuer.
        subject:
          type: string
          minLength: 1
          maxLength: 512
        audience:
          type: string
          minLength: 1
          maxLength: 512
          description: |
            Mandatory, and may not be the issuer's default. A Kubernetes token
            minted for the default API-server audience would otherwise
            authenticate here, and a Forgejo Actions audience defaults to
            `<instance>/<owner>`, shared across every repository that owner has.
        required_claims:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: "#/components/schemas/FederatedClaimPin"
          description: |
            Every pinned claim, all of which validation requires. A Forgejo or
            GitHub Actions binding MUST pin `event_name`: `pull_request_target`
            carries the ordinary ref-form subject — the default branch's subject,
            the one a production binding names — so the protection comes from the
            pinned event, never from the subject's shape.
        indefinite:
          type: boolean
        lifetime_seconds:
          type: integer
          minimum: 1
        replaces:
          allOf:
            - $ref: "#/components/schemas/ID"
          description: |
            The binding this one supersedes. Bindings are IMMUTABLE, so every
            change is a replacement mint carrying the full formula: the
            predecessor is revoked and the successor inserted in one transaction.

    FederatedBinding:
      type: object
      additionalProperties: false
      required: [credential, issuer_id, clamped]
      properties:
        credential:
          $ref: "#/components/schemas/MachineCredential"
        issuer_id:
          $ref: "#/components/schemas/ID"
        clamped:
          type: boolean
          description: True when the instance ceiling shortened the requested lifetime.
        replaced_id:
          allOf:
            - $ref: "#/components/schemas/ID"
          description: The predecessor this mint revoked, absent for a first issue.

    DeliveredKey:
      type: object
      additionalProperties: false
      required: [name, classification, presence]
      description: |
        One key as the machine surface delivers it. There is deliberately NO
        value property, and its absence is not a placeholder: no plaintext
        crosses this surface, so the ticket that adds values has to add the
        member deliberately.
      properties:
        name:
          type: string
          maxLength: 256
        classification:
          $ref: "#/components/schemas/KeyClassification"
        presence:
          type: string
          enum: [required, forbidden, optional, set]
          description: |
            What the fetch reports about this key in the addressed
            environment. `set` is a key the committed snapshot actually
            delivers (#51 -- values landed, and the change token moves with
            them); the other three are the declared presence rules for keys
            the snapshot does not carry.

    DeliveryResponse:
      type: object
      additionalProperties: false
      required: [current, cursor, change_token, schema_revision, keys]
      description: |
        Either the authorized projection, or the statement that the presented
        cursor is current — in which case `keys` is empty and NOTHING was
        disclosed. Only a fetch that actually delivers values is a disclosure.
      properties:
        current:
          type: boolean
          description: |
            True when the presented cursor named the state the server was about
            to serve.
        cursor:
          type: string
          maxLength: 128
          description: |
            The opaque cursor for the state this answer describes, returned on
            BOTH dispositions so a caller told "current" can keep polling without
            re-fetching to learn its own cursor.

            It is bound to four things — the change token, the caller's
            authorized delivery projection, the principal's authorization
            revision, and the pin generation — never to content alone. Any
            authorization movement therefore invalidates it and produces a full
            authorized delivery rather than a "current" answer.
        change_token:
          type: string
          maxLength: 128
          description: |
            The keyed delivery-manifest token, `v1:`-prefixed. Keyed rather than
            a content digest, so it is unforgeable and un-invertible without the
            server key and may flow into pod annotations, logs and
            change-detection caches as ordinary non-secret metadata.
        schema_revision:
          type: integer
          minimum: 0
          description: The project's monotonic key-catalogue revision.
        keys:
          type: array
          items:
            $ref: "#/components/schemas/DeliveredKey"
          description: Empty when `current` is true.

    CredentialPolicy:
      type: object
      additionalProperties: false
      required: [max_finite_lifetime_seconds, allow_indefinite, max_live_credentials]
      properties:
        max_finite_lifetime_seconds:
          type: integer
          minimum: 1
        allow_indefinite:
          type: boolean
        max_live_credentials:
          type: integer
          minimum: 1
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        updated_by:
          $ref: "#/components/schemas/ID"

    SetCredentialPolicyRequest:
      type: object
      additionalProperties: false
      required: [max_finite_lifetime_seconds, allow_indefinite, max_live_credentials]
      properties:
        max_finite_lifetime_seconds:
          type: integer
          minimum: 1
        allow_indefinite:
          type: boolean
        max_live_credentials:
          type: integer
          minimum: 1
        confirm:
          type: boolean
          description: |
            Acknowledges the enumerated affected credentials. A tightening
            refuses with 409 until this is true, so a settings change never
            silently kills a live credential.

    AffectedCredential:
      type: object
      additionalProperties: false
      required: [id, service_account_id, reason]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        service_account_id:
          $ref: "#/components/schemas/ID"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        reason:
          type: string
          enum: [clamped, indefinite-withdrawn]

    CredentialPolicyResult:
      type: object
      additionalProperties: false
      required: [applied, policy, affected, clamped_count]
      properties:
        applied:
          type: boolean
          description: |
            False when the request was a PREVIEW: a tightening whose affected
            credentials the caller has not acknowledged with `confirm`.
            Nothing was written, and `affected` is the enumeration the caller
            must see before asking again. A settings change never silently
            kills a live credential.
        policy:
          $ref: "#/components/schemas/CredentialPolicy"
        affected:
          type: array
          items:
            $ref: "#/components/schemas/AffectedCredential"
        clamped_count:
          type: integer
          minimum: 0

    Capability:
      type: string
      description: |
        One atom from the permission ADR's CLOSED capability set. The server
        refuses anything outside it rather than storing a row nothing can ever
        evaluate, so this is a bounded string rather than an enum only to keep
        the contract additive as later tickets register their atoms.
      minLength: 1
      maxLength: 64
      pattern: "^[a-z][a-z-]{0,63}$"

    RoleTemplate:
      type: string
      description: The closed v1 role template set.
      enum: [viewer, editor, publisher, revealer, historian, maintainer, admin, operator]

    CreateGrantRequest:
      type: object
      additionalProperties: false
      required: [principal, capability]
      properties:
        principal:
          $ref: "#/components/schemas/ID"
        capability:
          $ref: "#/components/schemas/Capability"

    ApplyTemplateRequest:
      type: object
      additionalProperties: false
      required: [principal, template]
      properties:
        principal:
          $ref: "#/components/schemas/ID"
        template:
          $ref: "#/components/schemas/RoleTemplate"

    GrantOrigin:
      type: object
      additionalProperties: false
      required: [kind, subject]
      description: |
        One origin holding a grant row alive. A row exists while at least one
        origin holds it and is revoked, with the session-generation advance,
        when its last origin is released. Origins are never consulted by
        authorization: authority is the bare (principal, capability, scope)
        triple.
      properties:
        kind:
          type: string
          enum: [manual, break-glass, scim, structural, lockout-retention]
        subject:
          type: string
          description: |
            The origin's holder identity, discriminated by kind: the granting
            principal for `manual`, the fixed local-host marker for
            `break-glass`, the binding id for `scim`/`structural`.
          maxLength: 128

    Grant:
      type: object
      additionalProperties: false
      required: [id, principal_id, capability, scope, origins, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        principal_id:
          $ref: "#/components/schemas/ID"
        capability:
          $ref: "#/components/schemas/Capability"
        scope:
          $ref: "#/components/schemas/GrantScope"
        origins:
          type: array
          description: The origin chips for this capability line.
          items:
            $ref: "#/components/schemas/GrantOrigin"
        created_at:
          $ref: "#/components/schemas/Timestamp"

    GrantScope:
      type: object
      additionalProperties: false
      description: |
        The scope the grant was made at. All three absent is instance scope.
        Grants inherit downward, so a grant at a scope applies to everything
        beneath it.
      properties:
        org_id:
          $ref: "#/components/schemas/ID"
        project_id:
          $ref: "#/components/schemas/ID"
        environment_id:
          $ref: "#/components/schemas/ID"

    GrantList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Grant"
        count:
          type: integer
          minimum: 0
          description: Total rows matching, which for an unpaged list equals `items` length.

    GrantResult:
      type: object
      additionalProperties: false
      required: [grant_id, capability, created, origin_added]
      properties:
        grant_id:
          $ref: "#/components/schemas/ID"
        capability:
          $ref: "#/components/schemas/Capability"
        created:
          type: boolean
          description: False when an existing row was deduplicated and this call only attached an origin.
        origin_added:
          type: boolean
          description: False when the caller's own origin already held the row - a genuinely idempotent repeat.

    GrantResultList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GrantResult"
        count:
          type: integer
          minimum: 0

    EnvironmentSettings:
      type: object
      additionalProperties: false
      required: [protected]
      properties:
        protected:
          type: boolean
        reauth_window_seconds:
          type: [integer, "null"]
          minimum: 0
          description: |
            The environment's own reauthentication window. Null or absent means
            it inherits the instance default - which is NOT the same statement
            as 0, and 0 is a legal value meaning every disclosure
            reauthenticates.

    KeyName:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Z_][A-Z0-9_]*$"
      description: |
        The canonical key grammar: uppercase ASCII, digits and underscore, no
        leading digit. It is the environment-variable-safe grammar every
        delivery surface assumes - an execve environment block, a Kubernetes
        Secret data key, an adapter effective name - so it is a delivery
        constraint, not a style preference. `maxLength` counts code points
        here and bytes in the service; the grammar is ASCII, so they agree.

    KeyClassification:
      type: string
      enum: [secret, config]
      description: |
        Classification IS the sensitivity boundary. A matrix row is uniformly
        secret or config; it changes only through the reclassification
        ceremony. Closed, deliberately: a third value would be a third
        disclosure regime.

    KeyFolderPath:
      type: string
      maxLength: 256
      description: |
        The key's namespace within the project. Organizational only: a plain
        slash-separated path, empty for the catalogue root. It is a PATH, not a
        folder reference - no folder row need exist for it.

    KeyRule:
      type: object
      additionalProperties: false
      required: [type]
      description: |
        One primitive type declaration with its constraints. Each constraint
        belongs to exactly one type, and a constraint declared on the wrong
        type is REFUSED rather than ignored: a silently ignored `pattern` on an
        integer key is the "appears to enforce something and does not" failure
        the schema model rejects everywhere. This document carries shape; the
        service is the authority on every rule below.
      properties:
        type:
          type: string
          enum: [string, integer, boolean, enum, url, json]
        min_length:
          type: integer
          minimum: 0
          description: "`string` only."
        max_length:
          type: integer
          minimum: 0
          description: "`string` only."
        pattern:
          type: string
          maxLength: 512
          description: |
            `string` only. RE2, and ANCHORED TO THE WHOLE VALUE - implicitly
            `\A(?:...)\z`, never a substring search. Backreferences and
            lookaround do not exist in RE2 and are refused at declaration.
        allow_empty:
          type: boolean
          description: "`string` only; defaults to false."
        min:
          type: integer
          format: int64
          description: "`integer` only."
        max:
          type: integer
          format: int64
          description: "`integer` only."
        members:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 512
          description: |
            `enum` only. Members must be non-empty and distinct after the
            write-time trim.
        schemes:
          type: array
          maxItems: 32
          items:
            type: string
          description: "`url` only: the allowed scheme list."
        json_schema:
          type: string
          maxLength: 16384
          description: |
            `json` only: a JSON Schema 2020-12 document, carried as a STRING so
            the bytes the profile checks are the bytes the client sent. A
            re-encoded object would lose duplicate-key detection (Go's decoder
            is last-wins) and number precision, and duplicate object keys are a
            rejection here, not last-wins. The accepted subset is a pinned,
            profiled, budgeted allowlist enforced by the service.

    KeyDeclaration:
      type: object
      additionalProperties: false
      description: |
        Exactly one of `rule` or `any_of`. `any_of` is a bounded union whose
        value is valid if it satisfies AT LEAST ONE alternative - deliberately
        not `oneOf`, whose JSON Schema meaning is exactly-one, because two
        meanings for one word inside one product is a trap. Alternatives may
        not nest.
      properties:
        rule:
          $ref: "#/components/schemas/KeyRule"
        any_of:
          type: array
          minItems: 2
          maxItems: 8
          items:
            $ref: "#/components/schemas/KeyRule"

    KeyPresence:
      type: object
      additionalProperties: false
      required: [mode]
      description: |
        A mode plus an explicit set, never a bare id list: `all` is SYMBOLIC
        and covers environments created later, so expanding it into the ids
        existing at declaration time would silently exempt a new environment
        from a rule the operator wrote as "always". `none` is the default.
      properties:
        mode:
          type: string
          enum: [all, none, explicit]
        environment_ids:
          type: array
          items:
            $ref: "#/components/schemas/ID"
          description: "`explicit` only; empty or absent for `all` and `none`."

    KeyPresenceRules:
      type: object
      additionalProperties: false
      required: [required_in, forbidden_in]
      description: |
        Presence is the ONLY thing that varies per environment; every other
        constraint is project-wide. `required` is a predicate about presence
        only - it means "resolves to set" and says nothing about content.
      properties:
        required_in:
          $ref: "#/components/schemas/KeyPresence"
        forbidden_in:
          $ref: "#/components/schemas/KeyPresence"

    Key:
      type: object
      required:
        [id, org_id, project_id, name, folder_path, classification, description,
         deprecated, deprecation_note, declaration, presence, group_id, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        org_id:
          $ref: "#/components/schemas/ID"
        project_id:
          $ref: "#/components/schemas/ID"
        name:
          $ref: "#/components/schemas/KeyName"
        folder_path:
          $ref: "#/components/schemas/KeyFolderPath"
        classification:
          $ref: "#/components/schemas/KeyClassification"
        description:
          type: string
          maxLength: 4096
        deprecated:
          type: boolean
        deprecation_note:
          type: string
          maxLength: 4096
        declaration:
          $ref: "#/components/schemas/KeyDeclaration"
        presence:
          $ref: "#/components/schemas/KeyPresenceRules"
        group_id:
          type: string
          description: The key's group, or empty when it belongs to none.
        created_at:
          $ref: "#/components/schemas/Timestamp"

    KeyList:
      type: object
      required: [items, count, schema_revision]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Key"
        count:
          type: integer
          minimum: 0
          description: Total rows matching, which for an unpaged list equals `items` length.
        schema_revision:
          type: integer
          format: int64
          minimum: 0
          description: |
            The project's monotonic key-catalogue revision, which IS its schema
            revision. It advances on every semantic declaration change and on
            nothing else.

    CreateKeyRequest:
      type: object
      additionalProperties: false
      required: [name, classification, declaration]
      properties:
        name:
          $ref: "#/components/schemas/KeyName"
        classification:
          $ref: "#/components/schemas/KeyClassification"
        folder_path:
          $ref: "#/components/schemas/KeyFolderPath"
        description:
          type: string
          maxLength: 4096
        deprecated:
          type: boolean
        deprecation_note:
          type: string
          maxLength: 4096
        declaration:
          $ref: "#/components/schemas/KeyDeclaration"
        presence:
          $ref: "#/components/schemas/KeyPresenceRules"
        group_id:
          type: string

    UpdateKeyMetadataRequest:
      type: object
      additionalProperties: false
      properties:
        folder_path:
          $ref: "#/components/schemas/KeyFolderPath"
        description:
          type: string
          maxLength: 4096
        deprecated:
          type: boolean
        deprecation_note:
          type: string
          maxLength: 4096
        classification:
          $ref: "#/components/schemas/KeyClassification"

    RenameKeyRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/KeyName"

    UpdateKeyDeclarationRequest:
      type: object
      additionalProperties: false
      required: [declaration, presence]
      properties:
        declaration:
          $ref: "#/components/schemas/KeyDeclaration"
        presence:
          $ref: "#/components/schemas/KeyPresenceRules"

    ReclassifyKeyRequest:
      type: object
      additionalProperties: false
      required: [classification]
      properties:
        classification:
          $ref: "#/components/schemas/KeyClassification"

    SetKeyGroupRequest:
      type: object
      additionalProperties: false
      required: [group_id]
      properties:
        group_id:
          type: string
          description: The group to join, or empty to leave every group.

    KeyGroup:
      type: object
      required: [id, org_id, project_id, name, members, inert, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        org_id:
          $ref: "#/components/schemas/ID"
        project_id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          maxLength: 128
        members:
          type: array
          items:
            $ref: "#/components/schemas/KeyName"
          description: The member key names, sorted.
        inert:
          type: boolean
          description: |
            A group with fewer than two members couples nothing. It is flagged
            rather than deleted behind the operator's back - they are usually
            mid-way through building it.
        created_at:
          $ref: "#/components/schemas/Timestamp"

    KeyGroupList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KeyGroup"
        count:
          type: integer
          minimum: 0

    CreateKeyGroupRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128

    RenameKeyGroupRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128

    AuthMethods:
      type: object
      additionalProperties: false
      required: [providers, local_login_enabled]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/AuthMethodProvider"
        local_login_enabled:
          type: boolean

    AuthMethodProvider:
      type: object
      additionalProperties: false
      required: [slug, display_name, kind]
      properties:
        slug:
          type: string
        display_name:
          type: string
        kind:
          $ref: "#/components/schemas/IdentityProviderKind"

    OidcStartRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose:
          type: string
          enum: [login, link, reauth]
        environment_id:
          type: string
          maxLength: 64
          description: Required for reauth; the window scope.
        proof:
          type: string
          maxLength: 1024
          description: Required for link; the pre-existing password.

    OidcStartResult:
      type: object
      additionalProperties: false
      required: [authorization_url]
      properties:
        authorization_url:
          type: string
          description: The IdP authorization URL to redirect the browser to.

    SamlStartRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose:
          type: string
          enum: [login, link, reauth]
        environment_id:
          type: string
          maxLength: 64
          description: Required for reauth; the reveal-window scope.
        proof:
          type: string
          maxLength: 1024
          description: Required for link; the pre-existing account-security proof.

    SamlStartResult:
      type: object
      additionalProperties: false
      required: [redirect_url]
      properties:
        redirect_url:
          type: string
          format: uri
          description: The IdP HTTP-Redirect URL carrying the AuthnRequest.

    SamlACSRequest:
      type: object
      additionalProperties: false
      required: [SAMLResponse, RelayState]
      properties:
        SAMLResponse:
          type: string
          minLength: 1
          maxLength: 524288
          description: Base64-encoded SAML Response; decoded XML is capped at 256 KiB.
        RelayState:
          type: string
          minLength: 16
          maxLength: 512
          description: Server-minted opaque transaction handle, never a continuation URL.

    IdentityLinkRequest:
      type: object
      additionalProperties: false
      required: [provider, proof]
      properties:
        provider:
          type: string
          maxLength: 64
        proof:
          type: string
          maxLength: 1024

    IdentityUnlinkRequest:
      type: object
      additionalProperties: false
      required: [proof]
      properties:
        proof:
          type: string
          maxLength: 1024

    ExternalIdentity:
      type: object
      additionalProperties: false
      required: [id, kind, issuer, subject, provider_id, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        kind:
          $ref: "#/components/schemas/IdentityProviderKind"
        issuer:
          type: string
        subject:
          type: string
        provider_id:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"

    IdentityList:
      type: object
      additionalProperties: false
      required: [identities]
      properties:
        identities:
          type: array
          items:
            $ref: "#/components/schemas/ExternalIdentity"

    OidcProviderInput:
      type: object
      additionalProperties: false
      required: [display_name, issuer, client_id, client_secret, scopes, enabled]
      properties:
        display_name:
          type: string
          maxLength: 256
        issuer:
          type: string
          maxLength: 2048
          description: Byte-exact, immutable after create (A3).
        client_id:
          type: string
          maxLength: 1024
        client_secret:
          type: string
          maxLength: 4096
          description: Envelope-encrypted at rest; never returned.
        scopes:
          type: string
          maxLength: 1024
        jit_policy:
          type: [string, "null"]
          maxLength: 4096
          description: JSON `{claim, values[]}`; absent means no JIT.
        assurance_policy:
          type: [string, "null"]
          maxLength: 4096
          description: JSON `{acr_values[], amr_sets[][]}`; absent means single-factor.
        enabled:
          type: boolean

    OidcProvider:
      type: object
      additionalProperties: false
      required: [slug, display_name, issuer, client_id, scopes, redirect_uri, enabled]
      properties:
        slug:
          type: string
        display_name:
          type: string
        issuer:
          type: string
        client_id:
          type: string
        scopes:
          type: string
        redirect_uri:
          type: string
        jit_policy:
          type: [string, "null"]
        assurance_policy:
          type: [string, "null"]
        enabled:
          type: boolean

    OidcProviderList:
      type: object
      additionalProperties: false
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/OidcProvider"

    IdentityProviderKind:
      type: string
      description: Closed protocol discriminator in the byte-exact external-identity key.
      enum: [oidc, saml]

    SamlMetadataSource:
      type: string
      description: Closed source set; URL means one-shot admin-initiated fetch, never a poller.
      enum: [file, url]

    SamlProviderInput:
      type: object
      additionalProperties: false
      description: |
        SAML authentication configuration. Exactly one of `metadata_document`
        and `metadata_url` must match `metadata_source`; the service enforces
        that conditional before fetching or parsing. No JIT member exists:
        SAML never provisions accounts.
      required:
        - display_name
        - entity_id
        - metadata_source
        - allow_email_nameid
        - force_sign_requests
        - enabled
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 256
        entity_id:
          type: string
          minLength: 1
          maxLength: 2048
          description: |
            Configured byte-exact IdP entityID used to select exactly one
            EntityDescriptor from metadata; immutable after create.
        metadata_source:
          $ref: "#/components/schemas/SamlMetadataSource"
        metadata_document:
          type: [string, "null"]
          maxLength: 262144
          description: Raw IdP metadata XML for a file-backed configuration.
        metadata_url:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          description: One-shot WebPKI URL; redirects off-origin are refused.
        confirmed_fingerprints:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
          description: Fingerprints explicitly confirmed in the current ceremony.
        confirmed_endpoints:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            format: uri
            maxLength: 2048
          description: New endpoint URLs explicitly confirmed in the current ceremony.
        assurance_policy:
          type: [array, "null"]
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 2048
          description: Accepted AuthnContextClassRef values; null means single-factor.
        allow_email_nameid:
          type: boolean
          description: Explicit opt-in to opaque emailAddress NameID values; never email linking.
        force_sign_requests:
          type: boolean
          description: Force signed AuthnRequests even when metadata does not demand them.
        enabled:
          type: boolean

    SamlMetadataRefreshRequest:
      type: object
      additionalProperties: false
      properties:
        metadata_document:
          type: [string, "null"]
          maxLength: 262144
          description: Replacement XML for a file-backed provider; absent for URL-backed providers.
        confirmed_fingerprints:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        confirmed_endpoints:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            format: uri
            maxLength: 2048

    SamlProviderPatch:
      type: object
      additionalProperties: false
      description: Omitted members preserve their stored values.
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 256
        assurance_policy:
          type: [array, "null"]
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 2048
        allow_email_nameid:
          type: boolean
        force_sign_requests:
          type: boolean
        enabled:
          type: boolean

    SamlProvider:
      type: object
      additionalProperties: false
      required:
        - slug
        - display_name
        - kind
        - entity_id
        - acs_url
        - sso_redirect_url
        - signing_certificate_fingerprints
        - allow_email_nameid
        - force_sign_requests
        - metadata_source
        - metadata_signed
        - warnings
        - enabled
        - row_version
        - created_at
        - updated_at
      properties:
        slug:
          type: string
        display_name:
          type: string
        kind:
          type: string
          enum: [saml]
        entity_id:
          type: string
          description: Byte-exact IdP entityID; immutable after create.
        acs_url:
          type: string
          format: uri
        sso_redirect_url:
          type: string
          format: uri
        signing_certificate_fingerprints:
          type: array
          items:
            type: string
        assurance_policy:
          type: [array, "null"]
          items:
            type: string
        allow_email_nameid:
          type: boolean
        force_sign_requests:
          type: boolean
        metadata_source:
          $ref: "#/components/schemas/SamlMetadataSource"
        metadata_url:
          type: [string, "null"]
          format: uri
        metadata_signed:
          type: boolean
        metadata_signing_fingerprint:
          type: [string, "null"]
        metadata_valid_until:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/SamlProviderWarning"
        enabled:
          type: boolean
        row_version:
          type: integer
          minimum: 1
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    SamlProviderWarning:
      type: object
      additionalProperties: false
      required: [code, severity, message, effective_at]
      properties:
        code:
          type: string
          enum:
            - metadata_expires_soon
            - metadata_expired
            - signing_certificate_not_yet_valid
            - signing_certificate_expired
        severity:
          type: string
          enum: [warning, error]
        message:
          type: string
          maxLength: 512
        effective_at:
          $ref: "#/components/schemas/Timestamp"
        fingerprint:
          type: string
          description: Present only for certificate warnings.

    SamlProviderList:
      type: object
      additionalProperties: false
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/SamlProvider"

    SamlSpKey:
      type: object
      additionalProperties: false
      required: [fingerprint, state, created_at]
      properties:
        fingerprint:
          type: string
          description: URL-safe unpadded base64 SHA-256 fingerprint of SubjectPublicKeyInfo, prefixed by `sha256:`.
        state:
          type: string
          enum: [active, retiring]
        created_at:
          $ref: "#/components/schemas/Timestamp"

    SamlSpKeyList:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/SamlSpKey"

    SamlMetadataDiff:
      type: object
      additionalProperties: false
      required:
        - endpoints_added
        - endpoints_removed
        - certs_added_fps
        - certs_removed_fps
      properties:
        endpoints_added:
          type: array
          items: { type: string }
        endpoints_removed:
          type: array
          items: { type: string }
        certs_added_fps:
          type: array
          items: { type: string }
        certs_removed_fps:
          type: array
          items: { type: string }
        valid_until:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    SamlProviderMutationResult:
      type: object
      additionalProperties: false
      description: |
        `applied=false` is the first leg of the metadata ceremony: no trust
        state changed, `diff` is displayed, and every value in
        `required_fingerprints` and `required_endpoints` must be explicitly
        supplied on a rerun.
      required: [applied, diff, required_fingerprints, required_endpoints]
      properties:
        applied:
          type: boolean
        provider:
          oneOf:
            - $ref: "#/components/schemas/SamlProvider"
            - type: "null"
        diff:
          $ref: "#/components/schemas/SamlMetadataDiff"
        required_fingerprints:
          type: array
          uniqueItems: true
          items:
            type: string
        required_endpoints:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uri

    WebauthnOptions:
      type: object
      additionalProperties: true
      description: |
        Opaque WebAuthn ceremony options (creation or request), generated by
        the relying party and handed to the browser `navigator.credentials`
        API verbatim. The server treats the blob as raw bytes; the base64url
        fields the authenticator signs over are preserved by round-tripping.

    WebauthnResponse:
      type: object
      additionalProperties: true
      description: |
        Opaque WebAuthn authenticator response (attestation or assertion) as
        produced by the browser, passed to the relying party as raw bytes.

    WebauthnEnrolStartRequest:
      type: object
      additionalProperties: false
      description: |
        The account-security proof, where the account has one to give. Both
        members are optional so a passwordless, factorless account can open a
        ceremony; the service enforces which proof it requires.
      properties:
        password:
          type: string
          maxLength: 1024
          description: The pre-existing password proof.
        code:
          type: string
          maxLength: 16
          description: A confirmed TOTP code proof.

    WebauthnReauthStartRequest:
      type: object
      additionalProperties: false
      required: [operation, environment_id, key_ids]
      properties:
        operation:
          $ref: "#/components/schemas/ReauthPurpose"
        environment_id:
          type: string
          maxLength: 64
        key_ids:
          type: array
          description: The credential ids the reauthentication is bound to.
          items:
            type: string
            maxLength: 256

    ReauthPurpose:
      type: string
      description: |
        The decision a disclosure ceremony authorizes. It is part of the SIGNED
        binding, not a label: without it an assertion given to `reveal` would be
        spendable on `publish` over the same environment and keys — the same
        unit, a different decision, and the human agreed to only one of them.
      enum:
        - reveal
        - copy
        - publish
        - mint

    WebauthnCredentialProofRequest:
      type: object
      additionalProperties: false
      description: |
        The account-security proof for removing a credential — the pre-existing
        password or a TOTP code, never the credential being removed (B7). Both
        optional; the service selects and enforces the required proof.
      properties:
        password:
          type: string
          maxLength: 1024
        code:
          type: string
          maxLength: 16

    ReauthResult:
      type: object
      additionalProperties: false
      required: [session_id, environment_id, single_decision, window_expires]
      properties:
        session_id:
          $ref: "#/components/schemas/ID"
        environment_id:
          type: string
        single_decision:
          type: boolean
          description: True where the effective window is zero — the window authorizes exactly one decision.
        window_expires:
          $ref: "#/components/schemas/Timestamp"

    RevealWindow:
      type: object
      additionalProperties: false
      required:
        [
          effective_window_seconds,
          protected,
          totp_offered,
          live,
          single_decision,
          can_reveal,
        ]
      description: |
        The reveal guard's state for one environment and the acting session.
        Nothing here is material: it is project settings plus the caller's own
        window.
      properties:
        effective_window_seconds:
          type: integer
          minimum: 0
          description: |
            The environment's resolved reauthentication window. `0` means
            every disclosure takes its own ceremony — the state a protected
            environment is capped at.
        protected:
          type: boolean
          description: |
            The protected-environment flag. Reported beside the window rather
            than folded into it, because "this environment is protected" and
            "the window is set to 0" are different sentences to a human even
            when they produce the same gate.
        totp_offered:
          type: boolean
          description: |
            Whether a TOTP code may open a window here. False exactly where
            the effective window is `0`: TOTP cannot bind a challenge to the
            enumerated unit, so a passkey ceremony is the only path there.
        live:
          type: boolean
          description: Whether a window is open for this session right now.
        single_decision:
          type: boolean
          description: |
            True when the live window authorizes exactly the keys its ceremony
            enumerated and is spent by one decision — never presented as a
            standing window with a countdown.
        can_reveal:
          type: boolean
          description: |
            Whether this principal satisfies `read(E) AND reveal(E)` here. It is
            an AFFORDANCE, never a decision — the chokepoint judges every
            disclosure regardless — and it is what makes the write-only editing
            path first-class: `edit` without `reveal` is a supported state, so
            the editor offers a blind-replacement field with honest microcopy
            rather than guessing from whether a cell happens to be on screen.
        expires_at:
          $ref: "#/components/schemas/Timestamp"

    PasskeyList:
      type: object
      additionalProperties: false
      required: [passkeys]
      properties:
        passkeys:
          type: array
          items:
            $ref: "#/components/schemas/Passkey"

    Passkey:
      type: object
      additionalProperties: false
      required: [id, label, discoverable, disabled, created_at, last_used_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        label:
          type: string
        discoverable:
          type: boolean
        disabled:
          type: boolean
          description: True for a credential disabled after a signature-count clone was detected.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        last_used_at:
          $ref: "#/components/schemas/Timestamp"
    CreateScimBindingRequest:
      type: object
      additionalProperties: false
      required: [provider_kind, provider_slug, subject_source]
      properties:
        provider_kind:
          type: string
          enum: [oidc, saml]
        provider_slug:
          type: string
          maxLength: 256
        subject_source:
          type: string
          maxLength: 256
          description: |
            `externalId` or a declared enterprise/custom extension path.
            `userName` is refused by name: RFC 7643 defines it
            `caseExact: false` and server-unique, which contradicts byte-exact
            identity material.
        nameid_format:
          type: string
          maxLength: 256
          description: |
            SAML bindings only. A scalar SCIM attribute cannot carry the locked
            SAML subject, so the binding declares the NameID PROFILE and the
            subject-source attribute supplies the NameID value alone.
        nameid_qualifier:
          type: string
          maxLength: 256
        nameid_qualifier_present:
          type: boolean
          description: |
            Presence is carried separately from value because an absent
            qualifier and an empty one are different inputs to the injective
            encoder, and collapsing them would make two SAML subjects collide.
        nameid_sp_qualifier:
          type: string
          maxLength: 256
        nameid_sp_qualifier_present:
          type: boolean
    MintScimCredentialRequest:
      type: object
      additionalProperties: false
      properties:
        proof:
          type: string
          maxLength: 512
          description: |
            The reauthentication proof: a TOTP code, or the account password
            where no factor is enrolled. Minting a provisioning credential is
            `manage-members(org)` AND reauthentication, so a stolen elevated
            session cannot issue a durable bearer on its own.
        indefinite:
          type: boolean
          description: |
            Requires the instance opt-in, which is default-off. Without it an
            indefinite credential is refused by name.
    ScimAttention:
      type: object
      description: |
        One raised attention state on a binding. Each names its cause AND a
        server-authored remediation: a state that only says something is wrong
        makes the binding view a puzzle.
      additionalProperties: false
      required: [state, subject_ref, cause, entered_at, remediation]
      properties:
        state:
          type: string
          description: |
            provider_unavailable | lockout_retention | manual_grants_remain |
            inert_mapping | stale | post_restore
          enum:
            - provider_unavailable
            - lockout_retention
            - manual_grants_remain
            - inert_mapping
            - stale
            - post_restore
        subject_ref:
          type: string
          description: Which object the state is about; empty for a binding-wide state.
        cause:
          type: string
          description: The triggering operation, empty where the state has no single trigger.
        entered_at:
          $ref: "#/components/schemas/Timestamp"
        remediation:
          type: string
          description: Server-authored — what to do about it.
    ScimBinding:
      type: object
      additionalProperties: false
      required:
        - id
        - org_id
        - provider_kind
        - provider_slug
        - provider_issuer
        - subject_source
        - connection_principal_id
        - created_at
        - attention
      properties:
        id:
          $ref: "#/components/schemas/ID"
        org_id:
          $ref: "#/components/schemas/ID"
        provider_kind:
          type: string
          enum: [oidc, saml]
        provider_slug:
          type: string
        provider_issuer:
          type: string
          description: |
            Frozen at creation. A provider whose issuer moved under a binding
            is a rebinding hazard, not a rename to follow silently.
        subject_source:
          type: string
          description: |
            The SCIM attribute path carrying identity material, immutable after
            creation. `userName` is refused by name.
        nameid_format:
          type: string
          description: The SAML NameID profile's Format URI; empty for an OIDC binding.
        nameid_qualifier:
          type: string
          description: The SAML NameID profile's fixed NameQualifier.
        nameid_qualifier_present:
          type: boolean
          description: |
            Whether the assertion carries a NameQualifier at all. Presence is
            reported separately from value because an absent qualifier and an
            empty one are different inputs to the injective subject encoder.
        nameid_sp_qualifier:
          type: string
          description: The SAML NameID profile's fixed SPNameQualifier.
        nameid_sp_qualifier_present:
          type: boolean
        connection_principal_id:
          $ref: "#/components/schemas/ID"
        last_contact_at:
          $ref: "#/components/schemas/Timestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        attention:
          type: array
          items:
            $ref: "#/components/schemas/ScimAttention"
    ScimBindingList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScimBinding"
        count:
          type: integer
    ScimBlastWarning:
      type: object
      additionalProperties: false
      required: [code, severity, message]
      description: |
        Server-authored consequence language. It is authored on the server, not
        in a client, because the locked rule is about what the human is TOLD,
        and a client rendering its own wording is a second, unreviewed policy.
      properties:
        code:
          type: string
          enum: [org_scope, reveal_expanding, production_environment, populated_group]
        severity:
          type: string
          enum: [warning, critical]
        message:
          type: string
    ScimCredential:
      type: object
      additionalProperties: false
      required: [id, binding_id, created_at, live]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        binding_id:
          $ref: "#/components/schemas/ID"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        revoked_at:
          $ref: "#/components/schemas/Timestamp"
        last_used_at:
          $ref: "#/components/schemas/Timestamp"
        live:
          type: boolean
    ScimCredentialList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScimCredential"
        count:
          type: integer
    ScimDirectoryGroup:
      type: object
      additionalProperties: false
      required: [id, display_name, member_count, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        display_name:
          type: string
        external_id:
          type: string
        member_count:
          type: integer
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    ScimDirectoryGroupList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScimDirectoryGroup"
        count:
          type: integer
    ScimDirectoryUser:
      type: object
      additionalProperties: false
      required: [id, user_name, account_id, active, groups, created_at, updated_at, attention]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        user_name:
          type: string
        external_id:
          type: string
        account_id:
          $ref: "#/components/schemas/ID"
        active:
          type: boolean
        groups:
          type: array
          items:
            $ref: "#/components/schemas/ID"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        attention:
          type: array
          items:
            $ref: "#/components/schemas/ScimAttention"
    ScimDirectoryUserList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScimDirectoryUser"
        count:
          type: integer
    ScimMapping:
      type: object
      additionalProperties: false
      required: [id, binding_id, group_id, template, inert, created_at, capabilities]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        binding_id:
          $ref: "#/components/schemas/ID"
        group_id:
          $ref: "#/components/schemas/ID"
        template:
          type: string
        project_id:
          type: string
        environment_id:
          type: string
        inert:
          type: boolean
          description: |
            The group this row names no longer exists at the identity provider.
            An inert row grants nothing and is never removed automatically.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        capabilities:
          type: array
          description: |
            What the row expands into. Expansion at sync time is expansion at
            grant time, so this is exactly the set a human applying the same
            template at the same scope would create.
          items:
            type: string
    ScimMappingList:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScimMapping"
        count:
          type: integer
    ScimMappingRequest:
      type: object
      additionalProperties: false
      required: [group_id, template]
      properties:
        group_id:
          $ref: "#/components/schemas/ID"
        template:
          type: string
          maxLength: 64
        project_id:
          type: string
          maxLength: 64
          description: |
            Absent means org scope, which is the WIDEST a binding can reach.
            Nothing preselects a scope for you, least of all a production
            environment.
        environment_id:
          type: string
          maxLength: 64
    ScimMappingResult:
      type: object
      additionalProperties: false
      required: [mapping, warnings, members_affected, grants_created, origins_released]
      properties:
        mapping:
          $ref: "#/components/schemas/ScimMapping"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ScimBlastWarning"
        members_affected:
          type: integer
        grants_created:
          type: integer
        origins_released:
          type: integer
    ScimMintResult:
      type: object
      additionalProperties: false
      required: [credential, token, rotated]
      properties:
        credential:
          $ref: "#/components/schemas/ScimCredential"
        token:
          type: string
          description: |
            Display-once. It is in this response and nowhere else, ever: only
            the SHA-256 verifier was stored.
        rotated:
          type: boolean
          description: |
            This mint joined an already-live credential. That IS overlap
            rotation — mint-new, update the identity provider, revoke-old, with
            identical authority throughout.
    ScimResource:
      type: object
      additionalProperties: true
      description: |
        A SCIM 2.0 resource or message, as RFC 7643/7644 shapes it. It is
        deliberately open: identity providers send and expect attributes this
        provider stores as round-tripped display metadata, and pinning the
        shape here would make a conformant IdP's request a contract violation.
        What IS closed lives in the server: the subject source, the filter
        grammar, the PATCH matrix and the error mapping, each with its own
        named refusal.

security:
  - hikyoSession: []
