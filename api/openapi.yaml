      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: diffValues
      tags: [values]
      summary: Compare two environments' values.
      description: |
        An explicit, authorized, per-invocation comparison - NOT an ambient
        drift signal: divergence between environments is the point of the flat
        model, so equality is not a health signal and nothing watches it.

        Oracle rules: write-presence without the reveal gate, plaintext only
        with it. Where both sides are `set` and at least one is unreadable,
        `equal` is ABSENT rather than false - whether two secrets match is
        itself material. Authorized per side, so `read` on one environment
        says nothing about the other.
      x-hikyo-class: tenant
      x-hikyo-operation: value.list
      x-hikyo-formula: [read@environment]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      parameters:
        - name: left
          in: query
          required: true
          description: The left environment.
          schema:
            $ref: "#/components/schemas/ID"
        - name: right
          in: query
          required: true
          description: The right environment.
          schema:
            $ref: "#/components/schemas/ID"
      responses:
        "200":
          description: One row per declared key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValueDiff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
