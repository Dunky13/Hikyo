    patch:
      operationId: updateFederationIssuer
      tags: [instance]
      summary: Move an issuer's JWKS source or refused audiences.
      description: |
        The mutable half only. The issuer string and the platform type cannot
        move: changing either would silently re-point every binding underneath at
        a different external authority, which is a replacement, not an edit.
      x-hikyo-class: instance
      x-hikyo-operation: federation.issuer-update
      x-hikyo-formula: [instance-config@instance]
      x-hikyo-artifacts: [human-session]
