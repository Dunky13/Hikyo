  /api/v1/accounts/{principal}/credential-reset:
    parameters:
      - $ref: "#/components/parameters/ResetTargetPrincipal"
    post:
      operationId: resetCredential
      tags: [accounts]
      summary: Issue a credential-establishment authority for another account.
      description: |
        Administrator-issued credential reset (human-auth ADR § Recovery). A
        credential-reset holder mints a single-use, hashed, expiring
        credential-establishment authority for a target, returned once and
        transmitted out of band. The reset advances the target's session
        generation and revokes its sessions in the same transaction.

        Org-scoped credential-reset reaches only a target whose grants lie
        entirely within that org and who holds no instance capability; the
        org-bounded test is evaluated in one serializable transaction with the
        target's grant set (a concurrent grant landing conflicts with the
        in-flight reset). A target holding an instance capability has no network
        reset path at all — break-glass only. This route dispatches between the
        org-scoped and instance-scoped credential-reset operations by that
        classification. Every failure that could enumerate the
        target — an unknown or non-human principal, a caller lacking
        credential-reset, an org-P holder reaching an org-O target, and a target
        holding an instance capability (break-glass only) — answers a single
        uniform `401`; the true cause is durable in the audit trail, never on the
        wire.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      responses:
        "200":
          description: A session-less credential-establishment authority, returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialResetResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/webauthn/enrol/start:
    post:
      operationId: enrolPasskeyStart
      tags: [auth]
      summary: Begin passkey enrolment; returns opaque creation options.
      description: |
        Verifies the account-security proof up front (the pre-existing password
        or a confirmed TOTP code, where one stands) and opens a registration
        ceremony, returning the browser-generated creation options verbatim.
        `enrol/finish` completes the enrolment.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebauthnEnrolStartRequest"
      responses:
        "200":
          description: Opaque WebAuthn creation options for the browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebauthnOptions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/webauthn/enrol/finish:
    post:
      operationId: enrolPasskeyFinish
      tags: [auth]
      summary: Complete passkey enrolment from the attestation response.
      description: |
        Validates the opaque attestation response against the live ceremony,
        stores the credential, and reissues the acting session. A browser
        session's reissued token is delivered on the `__Host-wenv` cookie.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebauthnResponse"
      responses:
        "200":
          description: Enrolled. The reissued session replaces the old one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/webauthn/login/start:
    post:
      operationId: passkeyLoginStart
      tags: [auth]
      summary: Begin a discoverable-credential passkey login.
      description: |
        Fully pre-auth: opens a discoverable-credential request ceremony and
        returns the opaque request options. Discloses nothing about which
        accounts or credentials exist.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      responses:
        "200":
          description: Opaque WebAuthn request options for the browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebauthnOptions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/webauthn/login/finish:
    post:
      operationId: passkeyLoginFinish
      tags: [auth]
      summary: Complete a passkey login from the assertion response.
      description: |
        Validates the opaque assertion against the live ceremony and mints a
        browser session carrying WebAuthn assurance, delivered on the
        `__Host-wenv` cookie. A signature-count regression disables the cloned
        credential (audited) and refuses.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebauthnResponse"
      responses:
        "200":
          description: The minted browser session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/webauthn/step-up/start:
    post:
      operationId: stepUpPasskeyStart
      tags: [auth]
      summary: Begin a passkey step-up for the acting session.
      description: |
        Opens a non-discoverable ceremony scoped to the acting account's
        credentials and returns opaque request options. `step-up/finish`
        elevates the session.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      responses:
        "200":
          description: Opaque WebAuthn request options for the browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebauthnOptions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/webauthn/step-up/finish:
    post:
      operationId: stepUpPasskeyFinish
      tags: [auth]
      summary: Elevate the acting session by presenting a passkey.
      description: |
        Validates the opaque assertion and appends `webauthn` to the acting
        session's factor set, rotating its token (delivered on the `__Host-wenv`
        cookie for a browser session). The original authenticated_at is
        preserved.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebauthnResponse"
      responses:
        "200":
          description: Session elevated. The rotated token replaces the old one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/webauthn/reauth/start:
    post:
      operationId: reauthPasskeyStart
      tags: [auth]
      summary: Begin a passkey reauthentication bound to an operation unit.
      description: |
        Opens a ceremony whose challenge is bound to the enumerated unit
        (environment plus the sorted credential ids), so the assertion
        authorizes exactly that unit. `reauth/finish` opens the window.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebauthnReauthStartRequest"
      responses:
        "200":
          description: Opaque WebAuthn request options for the browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebauthnOptions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/webauthn/reauth/finish:
    post:
      operationId: reauthPasskeyFinish
      tags: [auth]
      summary: Complete a passkey reauthentication; opens the window.
      description: |
        Validates the opaque assertion and opens a reauthentication window over
        the bound environment (single-decision where the effective window is
        zero). The reauth rotates the acting session; a browser session's
        rotated token is delivered on the `__Host-wenv` cookie.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebauthnResponse"
      responses:
        "200":
          description: The window this reauthentication opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebauthnReauthResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/webauthn/credentials:
    get:
      operationId: listPasskeys
      tags: [auth]
      summary: List the caller's enrolled passkeys.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      responses:
        "200":
          description: The caller's enrolled credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/webauthn/credentials/{id}:
    parameters:
      - $ref: "#/components/parameters/WebauthnCredentialID"
    delete:
      operationId: removePasskey
      tags: [auth]
      summary: Remove an enrolled passkey.
      description: |
        An account-security mutation proved by the pre-existing password or a
        TOTP code (never the credential being removed, B7). Refuses a removal
        that would drop a passwordless account below the passkey-only floor;
        reissues the acting session. A browser session's reissued token is
        delivered on the `__Host-wenv` cookie.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebauthnCredentialProofRequest"
      responses:
        "200":
          description: Removed. The reissued session replaces the old one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/instance/oidc-providers:
    get:
      operationId: listOidcProviders
      tags: [instance]
      summary: List configured OIDC providers.
      x-wenv-class: instance
      x-wenv-operation: oidc-provider.list
      x-wenv-formula: [instance-config@instance]
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      responses:
        "200":
          description: The configured providers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProviderList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/instance/oidc-providers/{slug}:
    parameters:
      - $ref: "#/components/parameters/ProviderSlugPath"
    get:
      operationId: getOidcProvider
      tags: [instance]
      summary: Read one OIDC provider.
      x-wenv-class: instance
      x-wenv-operation: oidc-provider.get
      x-wenv-formula: [instance-config@instance]
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      responses:
        "200":
          description: The provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProvider"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      operationId: putOidcProvider
      tags: [instance]
      summary: Create or reconfigure an OIDC provider.
      description: |
        The issuer is immutable after create (A3): a changed issuer is refused.
        Discovery is re-run and the document's issuer must byte-equal the
        configured one. A reconfigure sweeps every session authenticated through
        the provider (A4).
      x-wenv-class: instance
      x-wenv-operation: oidc-provider.put
      x-wenv-formula: [instance-config@instance]
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcProviderInput"
      responses:
        "200":
          description: The created or reconfigured provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProvider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: deleteOidcProvider
      tags: [instance]
      summary: Delete an OIDC provider.
      description: |
        Sweeps every session authenticated through the provider (A4); its live
        transactions cascade (A14).
      x-wenv-class: instance
      x-wenv-operation: oidc-provider.delete
      x-wenv-formula: [instance-config@instance]
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/instance/saml-providers:
    get:
      operationId: listSamlProviders
      tags: [instance]
      summary: List configured SAML providers.
      x-wenv-class: instance
      x-wenv-operation: saml-provider.list
      x-wenv-formula: [instance-config@instance]
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      responses:
        "200":
          description: The configured SAML providers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SamlProviderList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/instance/saml-providers/{slug}:
    parameters:
      - $ref: "#/components/parameters/ProviderSlugPath"
    get:
      operationId: getSamlProvider
      tags: [instance]
      summary: Read one SAML provider.
      x-wenv-class: instance
      x-wenv-operation: saml-provider.get
      x-wenv-formula: [instance-config@instance]
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      responses:
        "200":
          description: The provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SamlProvider"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      operationId: putSamlProvider
      tags: [instance]
      summary: Create or reconfigure a SAML provider from pinned metadata.
      description: |
        The configured entityID selects exactly one metadata descriptor and is
        immutable after create. File and one-shot URL sources enter the same
        diff-and-confirm ceremony;
        certificate, endpoint and assurance-policy changes sweep this
        provider's sessions. SAML never provisions accounts, so no JIT member
        exists in this request schema.
      x-wenv-class: instance
      x-wenv-operation: saml-provider.put
      x-wenv-formula: [instance-config@instance]
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SamlProviderInput"
      responses:
        "200":
          description: Applied provider or metadata diff requiring explicit confirmation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SamlProviderMutationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
    patch:
      operationId: patchSamlProvider
      tags: [instance]
      summary: Partially update SAML provider policy or disable the provider.
      description: |
        Omitted members preserve their stored values. Metadata, entityID and
        certificate changes cannot ride this path: they remain behind the
        metadata diff-and-confirm ceremony. Disabling sweeps this provider's
        sessions. This additive endpoint supports the locked `update` and
        `disable` CLI spellings without requiring unreadable metadata input.
      x-wenv-class: instance
      x-wenv-operation: saml-provider.patch
      x-wenv-formula: [instance-config@instance]
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SamlProviderPatch"
      responses:
        "200":
          description: The updated provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SamlProvider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: deleteSamlProvider
      tags: [instance]
      summary: Remove a SAML provider.
      description: Deletes every session authenticated through this provider.
      x-wenv-class: instance
      x-wenv-operation: saml-provider.delete
      x-wenv-formula: [instance-config@instance]
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/instance/saml-providers/{slug}/refresh-metadata:
    parameters:
      - $ref: "#/components/parameters/ProviderSlugPath"
    post:
      operationId: refreshSamlProviderMetadata
      tags: [instance]
      summary: Refresh and explicitly confirm a SAML provider's metadata diff.
      description: |
        Performs one URL fetch for URL-backed providers. Any new endpoint,
        assertion-signing certificate or metadata-signing fingerprint remains
        refused until named in `confirmed_fingerprints` and committed through
