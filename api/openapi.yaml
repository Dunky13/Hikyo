  # ---------------------------------------------------------------------------
  # The SCIM wire (#73 §8) — identity-protocol endpoints.
  #
  # RFC 7644 fixes the relative path shapes and identity providers take a
  # configurable base URL, so the per-binding base composes cleanly. These are
  # the IdP's wire and are meaningless to the SPA and to a human at a CLI: they
  # join the closed parity-exemption list as protocol paths, exactly as the
  # SAML and OIDC ceremony endpoints do.
  #
  # The credential presented must match the binding IN THE PATH — a mismatch is
  # a named authentication failure, audited, and answered 401. There is no
  # ambient routing by credential.
  #
  # No route here declares 403: `scim-provision` is not MFA-mandatory (machines
  # do not reauthenticate), so the assurance leg a 403 exists for cannot arise.
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{org}/scim/v2/{binding}/ServiceProviderConfig:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/ScimBindingID"
    get:
      operationId: scimServiceProviderConfig
      tags: [scim-protocol]
      summary: Advertise what this SCIM service provider implements.
      description: |
        The closed truth of what is implemented: no Bulk, no filter beyond the
        four `eq` probes, no sorting, no ETag, no change password. Each absence
        is advertised here AND refused by name at its endpoint, never
        half-implemented.
      x-hikyo-class: tenant
      x-hikyo-operation: scim-discovery.read
      x-hikyo-formula: [scim-provision@org]
      x-hikyo-artifacts: [scim-credential]
      x-hikyo-min-revision: 1
      responses:
        "200":
          description: The ServiceProviderConfig resource.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimResource"
        "401":
          description: |
            Authentication failed. Unknown, malformed, revoked, expired, epoch-superseded and wrong-binding credentials all answer this, so presentation reveals nothing about which credentials exist. A credential that does not match the binding in the path is an authentication failure, NEVER a SCIM 400.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimResource"
        "404":
          description: |
            A resource this binding did not mint, or a binding this caller cannot reach.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimResource"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: |
            An internal error, in the RFC 7644 shape. The SCIM surface answers
            its own error dialect for every status: an identity provider that
            met one Hikyo envelope among SCIM bodies would have to parse two.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimResource"

