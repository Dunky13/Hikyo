  # The access surface (#55, permission-model ADR). One path per addressed
  # scope depth, because the authorization formula differs per depth and the
  # ADR forbids "the capability for this endpoint" as a statement: a grant
  # addressed at environment depth is authorized by `manage-members(project)`,
  # since `manage-members` is not grantable at environment scope at all.
  #
  # The grant's scope IS the addressed path. There is no scope in any body:
  # a body-supplied scope would let a caller authorized at one depth write a
  # grant at another, which is the whole formula defeated by a JSON field.
  /api/v1/instance/grants:
    get:
      operationId: listInstanceGrants
      tags: [access]
      summary: List the instance-scope membership surface.
      description: |
        One line per capability per principal, with the origins holding it.
        Grants inside an org are NOT listed here even though instance-scope
        grants reach into every org: membership of a scope is what was granted
        AT it.
      x-hikyo-class: instance
      x-hikyo-operation: grant.list-instance
      x-hikyo-formula: [manage-members@instance]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      responses:
        "200":
          description: The instance-scope grant lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createInstanceGrant
      tags: [access]
      summary: Grant one capability at instance scope.
      x-hikyo-class: instance
      x-hikyo-operation: grant.create-instance
      x-hikyo-formula: [manage-members@instance]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGrantRequest"
      responses:
        "200":
          description: The grant, created or joined by a second origin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: revokeInstanceGrant
      tags: [access]
      summary: Revoke one capability at instance scope.
      description: |
        Releases the origins this surface owns and deletes the grant row when
        the last one is gone, advancing the target's session generation and
        deleting their sessions in the same transaction. Refused when it would
        remove the last instance `manage-members` holder.
      x-hikyo-class: instance
      x-hikyo-operation: grant.revoke-instance
      x-hikyo-formula: [manage-members@instance]
      x-hikyo-artifacts: [human-session]
      x-hikyo-min-revision: 1
      parameters:
        - $ref: "#/components/parameters/GrantPrincipal"
        - $ref: "#/components/parameters/GrantCapability"
      responses:
        "204":
          description: Revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

