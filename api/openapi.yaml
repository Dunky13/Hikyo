        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyValuesRequest"
      responses:
        "200":
          description: What landed, one entry per (key, destination).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyValuesResult"
