  /api/v1/auth/oidc/{provider}/start:
    parameters:
      - $ref: "#/components/parameters/ProviderSlug"
    post:
      operationId: oidcStart
      tags: [auth]
      summary: Begin an OIDC transaction (login, link or reauth).
      description: |
        Creates a single-use server-side transaction (PKCE S256 always) and
        returns the IdP authorization URL. `login` is anonymous and bound by a
        `__Host-` browser-binding cookie set on this response (A2/A16); `link`
        and `reauth` require an authenticated session and are session-bound, and
        `link` verifies the account-security proof up front (A6).
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcStartRequest"
      responses:
        "200":
          description: The IdP authorization URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcStartResult"
        # Every expected start refusal (unknown or disabled slug, bad purpose,
        # policy-less or environment-less reauth, unauthenticated link/reauth,
        # and a missing body) collapses to one uniform 401 so a pre-auth prober
        # cannot enumerate provider config. 429/500 are the cross-cutting
        # admission and fault responses.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/oidc/{provider}/callback:
    parameters:
      - $ref: "#/components/parameters/ProviderSlug"
    get:
      operationId: oidcCallback
      tags: [auth]
      summary: Complete an OIDC transaction from the IdP redirect.
      description: |
        Per-provider distinct callback path (mix-up defence leg 1): the path
        provider must equal the transaction's provider, refused BEFORE any token
        is fetched (A1). The transaction is consumed single-use, the code is
        exchanged only at the recorded provider, the ID token validated
        completely, and the purpose wall is structural. Returns the minted or
        rotated session.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string, maxLength: 4096 }
        - name: state
          in: query
          required: false
          schema: { type: string, maxLength: 512 }
        - name: iss
          in: query
          required: false
          schema: { type: string, maxLength: 2048 }
        - name: error
          in: query
          required: false
          schema: { type: string, maxLength: 256 }
      responses:
        "200":
          description: The minted or rotated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/saml/{provider}/start:
    parameters:
      - $ref: "#/components/parameters/ProviderSlug"
    post:
      operationId: samlStart
      tags: [auth]
      summary: Begin an SP-initiated SAML transaction (login, link or reauth).
      description: |
        Mints the server-side request, RelayState and initiator binding before
        returning the IdP HTTP-Redirect URL. `login` is anonymous; `link` and
        `reauth` require and bind the acting human session. The initiator cookie
        is delivered only as a Secure, HttpOnly, SameSite=None cookie scoped to
        this provider's ACS path; it is never returned in JSON.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [none, human-session]
      x-wenv-min-revision: 1
      security:
        - {}
        - wenvSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SamlStartRequest"
      responses:
        "200":
          description: The signed or unsigned IdP HTTP-Redirect URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SamlStartResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/saml/{provider}/acs:
    parameters:
      - $ref: "#/components/parameters/ProviderSlug"
    post:
      operationId: samlACS
      tags: [auth]
      summary: Complete an SP-initiated SAML transaction over HTTP-POST.
      description: |
        The only accepted response binding. The per-provider path, exact
        Destination, both Issuer legs, RelayState, InResponseTo and initiator
        binding must all resolve to the same live transaction before an
        ordinary session can be minted, linked or reauthenticated.
      x-wenv-class: unauthenticated
