          in: query
          required: false
          schema: { type: string, maxLength: 4096 }
        - name: state
          in: query
          required: false
          schema: { type: string, maxLength: 512 }
        - name: iss
          in: query
          required: false
          schema: { type: string, maxLength: 2048 }
        - name: error
          in: query
          required: false
          schema: { type: string, maxLength: 256 }
      responses:
        "200":
          description: The minted or rotated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
