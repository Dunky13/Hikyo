      x-wenv-class: instance
      x-wenv-operation: saml-provider.refresh-metadata
      x-wenv-formula: [instance-config@instance]
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SamlMetadataRefreshRequest"
      responses:
        "200":
          description: Applied provider or metadata diff requiring explicit confirmation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SamlProviderMutationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/instance/saml-sp-keys:
    get:
      operationId: listSamlSpKeys
