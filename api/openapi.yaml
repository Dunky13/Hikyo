  /api/v1/orgs/{org}/projects/{project}/environments/{environment}/reveal-window:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/EnvironmentID"
    get:
      operationId: getRevealWindow
      tags: [values]
      summary: The reveal guard's state for this environment and session.
      description: |
        The window gates the PROMPT, never the authorization check
        (permission-model ADR § The reveal guard), so a client has to know
        whether the next disclosure will prompt and which factor that prompt
        may offer. This route answers exactly that and discloses no material,
        which is why its formula is `read` alone: the effective window and the
        protected flag are project settings, and the live window is the
        caller's own session state.

        `totp_offered` is false exactly where the effective window is `0`.

        Human sessions only: a machine identity never reauthenticates, has no
        window to report, and reaches secret material through its own fetch
        path rather than this one.
      x-hikyo-class: tenant
      x-hikyo-operation: reveal.window_read
