# Wenv HTTP API — the single source of truth for every client.
#
# Hand-written and reviewed like code (api-cli-surface ADR § Version promise):
# the behavioural half of the freeze — authorization formula, side effects,
# idempotency, error semantics — is recorded here per operation and cannot be
# policed by schema diffing alone.
#
# OpenAPI 3.1 per the 2026-08-07 amendment banner in system-architecture.md.
# The bound 3.1 semantic profile, asserted by internal/api's profile tests:
#   * nullability is `type: [T, "null"]` — legacy `nullable` is prohibited;
#   * `jsonSchemaDialect` is the OAS 3.1 default dialect, alternates fail closed;
#   * top-level `webhooks` is prohibited in v1.
#
# Wenv extensions, each cross-checked against the Go registries in CI so the
# document cannot drift from the code it describes:
#   x-wenv-class      probe classification (tenant-isolation ADR invariant 1);
#                     must equal internal/authz's wire-registry entry.
#   x-wenv-operation  the registered authz operation this route reaches;
#                     absent for routes that reach none.
#   x-wenv-formula    the authorization formula, spelled `cap@level`; must
#                     equal the operation registry's formula pin.
#   x-wenv-artifacts  the authentication-artifact eligibility set
#                     (api-cli-surface ADR § verb × artifact matrix).
#   x-wenv-min-revision  the API revision an operation first appeared in; the
#                     capability registry a new client checks against an old
#                     server's advertised revision.
#   x-extensible-enum an enum declared OPEN: it may gain values additively and
#                     every generated consumer must tolerate unknown ones. The
#                     `enum` keyword is deliberately absent on open enums so
#                     runtime validation tolerates growth; a closed enum uses
#                     `enum` and never grows.
openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base

info:
  title: Wenv API
  version: "1"
  summary: Self-hosted environment and secret management.
  description: |
    Every response may gain fields additively within `/api/v1`; clients MUST
    ignore fields they do not know. Open enums (`x-extensible-enum`) may gain
    values; closed enums never do.

    Unauthorized is indistinguishable from nonexistent on every tenant-scoped
    route: status, body and shape are identical (permission model ADR). Error
    bodies carry a fixed message per code — nothing derived from the request —
    except `bad_request`, which is decided before any tenant resolution and so
    may carry a `detail` that leaks nothing about tenancy.
  license:
    name: MPL-2.0
    identifier: MPL-2.0

servers:
  - url: /
    description: The instance this document was served from.

tags:
  - name: meta
    description: Unauthenticated instance discovery.
  - name: auth
    description: |
      Identity-protocol endpoints — the closed, enumerated exception to the
      one-surface rule (api-cli-surface ADR). Client-specific by nature and
      parity-exempt; never domain endpoints.
  - name: orgs
    description: Organisation administration.

paths:
  /api/v1/meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: Instance discovery, unauthenticated.
      description: |
        The response is an exact closed allowlist: server version, API
        revision, and which authentication protocol flows this instance
        serves. Nothing tenant- or configuration-shaped — capability
        discovery beyond protocol selection happens after authentication.

        Sits under the instance-wide pre-auth admission limits like every
        other pre-auth path.
      security: []
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [none]
      x-wenv-min-revision: 1
      responses:
        "200":
          description: Instance metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/credential/establish:
    post:
      operationId: establishCredential
      tags: [auth]
      summary: Consume a credential-establishment authority and set an initial credential.
      description: |
        The named — and only — exception to "a new credential may never
        authorize its own enrolment" (human-auth ADR § Credential-establishment
        authority). The authority is target-bound, purpose-bound, single-use,
        expiring, and issued only by the bootstrap path, `credential-reset`,
        or local break-glass.

        Consuming it establishes exactly one initial credential, atomically,
        and nothing more: **no session is created, no assurance is carried,
        no reauthentication window opens.** The holder authenticates
        afterwards with the credential they just set, like anyone else.

        Every refusal — unknown authority, expired, already consumed, wrong
        epoch, weak password — answers the same `401` so presentation reveals
        nothing about which authorities exist.
      security: []
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [none]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstablishCredentialRequest"
      responses:
        "204":
          description: Credential established. No session, no assurance.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/local/login:
    post:
      operationId: localLogin
      tags: [auth]
      summary: Terminal-native local login; mints a CLI session artifact.
      description: |
        The local floor (human-auth ADR § Lockout and the local floor), which
        an installation may never remove. Verifies an Argon2id password
        verifier inside the instance-wide admission budget; an unknown account
        traverses a bounded dummy-verifier path so timing is comparable and no
        pre-authentication path distinguishes an existing account from a
        missing one.

        Mints a **CLI session** — a distinct artifact type with its own
        storage, lifetime, audit identity and revocation surface. The value is
        returned in the response body and is a replayable bearer credential;
        it is never re-retrievable.

        Browser sessions are a different artifact minted through the browser
        login page, which this slice does not serve — see `/api/v1/meta` for
        which protocol flows an instance actually offers.
      security: []
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [none]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalLoginRequest"
      responses:
        "200":
          description: Session minted. The token is displayed once and never again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the presented session.
      description: |
        Deletes the presented session row. Idempotent in effect: a session
        that no longer resolves answers `401` like any other unauthenticated
        request, because there is nothing to revoke and nothing to report.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/whoami:
    get:
      operationId: whoami
      tags: [auth]
      summary: Describe the presented session.
      description: |
        Reports the acting principal and how **this session** authenticated —
        the assurance record the chokepoint consults, never what the account
        could have presented (human-auth ADR § Assurance).
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      responses:
        "200":
          description: The acting session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoAmI"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/totp/enrol/start:
    post:
      operationId: enrolTotpStart
      tags: [auth]
      summary: Begin TOTP enrolment; returns the otpauth URI once.
      description: |
        An account-security proof up front (the pre-existing password, since no
        possession factor stands yet — human-auth ADR § Account-security
        mutations). Stages a sealed seed as a pending, inert enrolment and
        returns the `otpauth://` URI exactly once. It confirms nothing and
        mutates no session: `enrol/confirm` completes the enrolment. A confirmed
        factor already standing is refused (`400`).
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpEnrolStartRequest"
      responses:
        "200":
          description: The provisioning URI, returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrolStartResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/totp/enrol/confirm:
    post:
      operationId: enrolTotpConfirm
      tags: [auth]
      summary: Confirm TOTP enrolment with a code; reissues the session.
      description: |
        Consumes a valid code against the pending seed (single-use) and
        completes the enrolment as an account-security mutation: the generation
        advances, every session is deleted, and the acting session is reissued
        carrying ONLY the proof class — NOT `totp`. The user steps up separately
        to present the factor they just enrolled. The reissued token is returned
        and MUST replace the old one.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeRequest"
      responses:
        "200":
          description: Enrolment confirmed. The reissued session token replaces the old one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/totp/step-up:
    post:
      operationId: stepUpTotp
      tags: [auth]
      summary: Elevate the acting session by presenting a TOTP code.
      description: |
        A valid code consumes its step (single-use) and appends `totp` to the
        acting session's factor set, rotating its token — not an
        account-security mutation, so no generation advance and no session
        deletion, and the original authenticated_at is preserved (human-auth ADR
        § Assurance). The rotated token is returned and MUST replace the old one.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeRequest"
      responses:
        "200":
          description: Session elevated. The rotated token replaces the old one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/totp:
    delete:
      operationId: removeTotp
      tags: [auth]
      summary: Remove the confirmed TOTP factor.
      description: |
        An account-security mutation authorized by the password: the factor
        being removed is excluded from the proof set, so a stolen phone alone
        cannot drop the very factor it is (human-auth ADR § Account-security
        mutations, finding B7). Reissues the acting session carrying only the
        password class; the reissued token is returned.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpProofRequest"
      responses:
        "200":
          description: Factor removed. The reissued session token replaces the old one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/recovery-codes/regenerate:
    post:
      operationId: regenerateRecoveryCodes
      tags: [auth]
      summary: Replace the recovery-code batch; returns the codes once.
      description: |
        An account-security mutation proved by the confirmed TOTP code where one
        stands, else the password (recovery codes never authorize their own
        regeneration). Replaces the batch atomically and returns the plaintext
        codes exactly once. Reissues the acting session; the reissued token is
        returned and MUST replace the old one.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryProofRequest"
      responses:
        "200":
          description: New batch. The codes are displayed once and never again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/recovery/begin:
    post:
      operationId: beginRecovery
      tags: [auth]
      summary: Consume a recovery code for a credential-establishment authority.
      description: |
        The pre-auth break-in-glass path. Consumes a single-use recovery code
        and mints a credential-establishment authority that may only ever
        establish a password (human-auth ADR § Recovery). It creates **no
        session, no assurance, no reauthentication window** — the holder
        establishes a new password with the authority and then logs in.

        Rides the instance-wide admission budget; an unknown username, an absent
        batch, a stale epoch and a non-matching code all answer the same `401`.
      security: []
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [none]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryBeginRequest"
      responses:
        "200":
          description: A session-less credential-establishment authority, returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryBeginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/orgs:
    get:
      operationId: listOrgs
      tags: [orgs]
      summary: List organisations.
      description: |
        An instance-scoped operator read of cross-tenant metadata, and
        therefore itself audited — the audit model's default-deny rule refuses
        `audited: none` to instance-class operations. The event commits with
        the read.
      x-wenv-class: instance
      x-wenv-operation: org.list
      x-wenv-formula: [instance-config@instance]
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      responses:
        "200":
          description: The organisations this principal may administer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createOrg
      tags: [orgs]
      summary: Create an organisation.
      description: |
        The first audited mutating endpoint: authorization is evaluated at the
        chokepoint inside the request's own transaction, and the
        `org.created` audit event commits in that same transaction — a write
        without its durable record does not complete.

        Not idempotent: each call creates a distinct organisation.
      x-wenv-class: instance
      x-wenv-operation: org.create
      x-wenv-formula: [instance-config@instance]
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgRequest"
      responses:
        "201":
          description: The created organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/orgs/{org}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: getOrg
      tags: [orgs]
      summary: Read one organisation.
      x-wenv-class: instance
      x-wenv-operation: org.get
      x-wenv-formula: [instance-config@instance]
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      responses:
        "200":
          description: The organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/methods:
    get:
      operationId: authMethods
      tags: [auth]
      summary: Enabled login methods for this instance.
      description: |
        Public discovery: the enabled OIDC provider slugs and display names, and
        whether local login is enabled. Instance-level, never per-account, so it
        discloses nothing about which accounts or factors exist. Under the
        discovery admission bucket.
      security: []
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [none]
      x-wenv-min-revision: 1
      responses:
        "200":
          description: The enabled login methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMethods"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/oidc/{provider}/start:
    parameters:
      - $ref: "#/components/parameters/ProviderSlug"
    post:
      operationId: oidcStart
      tags: [auth]
      summary: Begin an OIDC transaction (login, link or reauth).
      description: |
        Creates a single-use server-side transaction (PKCE S256 always) and
        returns the IdP authorization URL. `login` is anonymous and bound by a
        `__Host-` browser-binding cookie set on this response (A2/A16); `link`
        and `reauth` require an authenticated session and are session-bound, and
        `link` verifies the account-security proof up front (A6).
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcStartRequest"
      responses:
        "200":
          description: The IdP authorization URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcStartResult"
        # Every expected start refusal (unknown or disabled slug, bad purpose,
        # policy-less or environment-less reauth, unauthenticated link/reauth,
        # and a missing body) collapses to one uniform 401 so a pre-auth prober
        # cannot enumerate provider config. 429/500 are the cross-cutting
        # admission and fault responses.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/oidc/{provider}/callback:
    parameters:
      - $ref: "#/components/parameters/ProviderSlug"
    get:
      operationId: oidcCallback
      tags: [auth]
      summary: Complete an OIDC transaction from the IdP redirect.
      description: |
        Per-provider distinct callback path (mix-up defence leg 1): the path
        provider must equal the transaction's provider, refused BEFORE any token
        is fetched (A1). The transaction is consumed single-use, the code is
        exchanged only at the recorded provider, the ID token validated
        completely, and the purpose wall is structural. Returns the minted or
        rotated session.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string, maxLength: 4096 }
        - name: state
          in: query
          required: false
          schema: { type: string, maxLength: 512 }
        - name: iss
          in: query
          required: false
          schema: { type: string, maxLength: 2048 }
        - name: error
          in: query
          required: false
          schema: { type: string, maxLength: 256 }
      responses:
        "200":
          description: The minted or rotated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/identities:
    get:
      operationId: listIdentities
      tags: [auth]
      summary: List the caller's linked external identities.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      responses:
        "200":
          description: The caller's linked identities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/identities/link:
    post:
      operationId: linkIdentity
      tags: [auth]
      summary: Begin linking an external identity (OIDC purpose=link).
      description: |
        An account-security mutation: verifies the pre-existing password up
        front and starts an OIDC link transaction bound to the acting session.
        Returns the IdP authorization URL; the link lands at the callback.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityLinkRequest"
      responses:
        "200":
          description: The IdP authorization URL for the link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcStartResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/identities/{id}:
    parameters:
      - $ref: "#/components/parameters/IdentityID"
    delete:
      operationId: unlinkIdentity
      tags: [auth]
      summary: Unlink an external identity.
      description: |
        An account-security mutation proved by the pre-existing password. Refuses
        removing the last remaining credential; deletes the identity's sessions;
        reissues the acting session. The reissued token replaces the old one.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityUnlinkRequest"
      responses:
        "200":
          description: Unlinked. The reissued session token replaces the old one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/webauthn/enrol/start:
    post:
      operationId: enrolPasskeyStart
      tags: [auth]
      summary: Begin passkey enrolment; returns opaque creation options.
      description: |
        Verifies the account-security proof up front (the pre-existing password
        or a confirmed TOTP code, where one stands) and opens a registration
        ceremony, returning the browser-generated creation options verbatim.
        `enrol/finish` completes the enrolment.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebauthnEnrolStartRequest"
      responses:
        "200":
          description: Opaque WebAuthn creation options for the browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebauthnOptions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/webauthn/enrol/finish:
    post:
      operationId: enrolPasskeyFinish
      tags: [auth]
      summary: Complete passkey enrolment from the attestation response.
      description: |
        Validates the opaque attestation response against the live ceremony,
        stores the credential, and reissues the acting session. A browser
        session's reissued token is delivered on the `__Host-wenv` cookie.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebauthnResponse"
      responses:
        "200":
          description: Enrolled. The reissued session replaces the old one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/webauthn/login/start:
    post:
      operationId: passkeyLoginStart
      tags: [auth]
      summary: Begin a discoverable-credential passkey login.
      description: |
        Fully pre-auth: opens a discoverable-credential request ceremony and
        returns the opaque request options. Discloses nothing about which
        accounts or credentials exist.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      responses:
        "200":
          description: Opaque WebAuthn request options for the browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebauthnOptions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/webauthn/login/finish:
    post:
      operationId: passkeyLoginFinish
      tags: [auth]
      summary: Complete a passkey login from the assertion response.
      description: |
        Validates the opaque assertion against the live ceremony and mints a
        browser session carrying WebAuthn assurance, delivered on the
        `__Host-wenv` cookie. A signature-count regression disables the cloned
        credential (audited) and refuses.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebauthnResponse"
      responses:
        "200":
          description: The minted browser session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/webauthn/step-up/start:
    post:
      operationId: stepUpPasskeyStart
      tags: [auth]
      summary: Begin a passkey step-up for the acting session.
      description: |
        Opens a non-discoverable ceremony scoped to the acting account's
        credentials and returns opaque request options. `step-up/finish`
        elevates the session.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      responses:
        "200":
          description: Opaque WebAuthn request options for the browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebauthnOptions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/webauthn/step-up/finish:
    post:
      operationId: stepUpPasskeyFinish
      tags: [auth]
      summary: Elevate the acting session by presenting a passkey.
      description: |
        Validates the opaque assertion and appends `webauthn` to the acting
        session's factor set, rotating its token (delivered on the `__Host-wenv`
        cookie for a browser session). The original authenticated_at is
        preserved.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebauthnResponse"
      responses:
        "200":
          description: Session elevated. The rotated token replaces the old one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/webauthn/reauth/start:
    post:
      operationId: reauthPasskeyStart
      tags: [auth]
      summary: Begin a passkey reauthentication bound to an operation unit.
      description: |
        Opens a ceremony whose challenge is bound to the enumerated unit
        (environment plus the sorted credential ids), so the assertion
        authorizes exactly that unit. `reauth/finish` opens the window.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebauthnReauthStartRequest"
      responses:
        "200":
          description: Opaque WebAuthn request options for the browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebauthnOptions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/webauthn/reauth/finish:
    post:
      operationId: reauthPasskeyFinish
      tags: [auth]
      summary: Complete a passkey reauthentication; opens the window.
      description: |
        Validates the opaque assertion and opens a reauthentication window over
        the bound environment (single-decision where the effective window is
        zero). The reauth rotates the acting session; a browser session's
        rotated token is delivered on the `__Host-wenv` cookie.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebauthnResponse"
      responses:
        "200":
          description: The window this reauthentication opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebauthnReauthResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/webauthn/credentials:
    get:
      operationId: listPasskeys
      tags: [auth]
      summary: List the caller's enrolled passkeys.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      responses:
        "200":
          description: The caller's enrolled credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/webauthn/credentials/{id}:
    parameters:
      - $ref: "#/components/parameters/WebauthnCredentialID"
    delete:
      operationId: removePasskey
      tags: [auth]
      summary: Remove an enrolled passkey.
      description: |
        An account-security mutation proved by the pre-existing password or a
        TOTP code (never the credential being removed, B7). Refuses a removal
        that would drop a passwordless account below the passkey-only floor;
        reissues the acting session. A browser session's reissued token is
        delivered on the `__Host-wenv` cookie.
      x-wenv-class: unauthenticated
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebauthnCredentialProofRequest"
      responses:
        "200":
          description: Removed. The reissued session replaces the old one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/instance/oidc-providers:
    get:
      operationId: listOidcProviders
      tags: [instance]
      summary: List configured OIDC providers.
      x-wenv-class: instance
      x-wenv-operation: oidc-provider.list
      x-wenv-formula: [instance-config@instance]
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      responses:
        "200":
          description: The configured providers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProviderList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/instance/oidc-providers/{slug}:
    parameters:
      - $ref: "#/components/parameters/ProviderSlugPath"
    get:
      operationId: getOidcProvider
      tags: [instance]
      summary: Read one OIDC provider.
      x-wenv-class: instance
      x-wenv-operation: oidc-provider.get
      x-wenv-formula: [instance-config@instance]
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      responses:
        "200":
          description: The provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProvider"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      operationId: putOidcProvider
      tags: [instance]
      summary: Create or reconfigure an OIDC provider.
      description: |
        The issuer is immutable after create (A3): a changed issuer is refused.
        Discovery is re-run and the document's issuer must byte-equal the
        configured one. A reconfigure sweeps every session authenticated through
        the provider (A4).
      x-wenv-class: instance
      x-wenv-operation: oidc-provider.put
      x-wenv-formula: [instance-config@instance]
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcProviderInput"
      responses:
        "200":
          description: The created or reconfigured provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProvider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: deleteOidcProvider
      tags: [instance]
      summary: Delete an OIDC provider.
      description: |
        Sweeps every session authenticated through the provider (A4); its live
        transactions cascade (A14).
      x-wenv-class: instance
      x-wenv-operation: oidc-provider.delete
      x-wenv-formula: [instance-config@instance]
      x-wenv-artifacts: [human-session]
      x-wenv-min-revision: 1
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"

components:
  securitySchemes:
    wenvSession:
      type: http
      scheme: bearer
      bearerFormat: ew_1_cli_...
      description: |
        A CLI session artifact minted by an identity-protocol endpoint. The
        server trusts nothing inside the value: kind, principal, expiry and
        credential epoch are read from the row the verifier resolves to.

  parameters:
    OrgID:
      name: org
      in: path
      required: true
      description: Organisation identifier.
      schema:
        $ref: "#/components/schemas/ID"
    ProviderSlug:
      name: provider
      in: path
      required: true
      description: OIDC provider slug.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
    ProviderSlugPath:
      name: slug
      in: path
      required: true
      description: OIDC provider slug.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
    IdentityID:
      name: id
      in: path
      required: true
      description: External identity identifier.
      schema:
        $ref: "#/components/schemas/ID"
    WebauthnCredentialID:
      name: id
      in: path
      required: true
      description: Enrolled passkey credential identifier.
      schema:
        $ref: "#/components/schemas/ID"

  responses:
    BadRequest:
      description: |
        The request does not satisfy this document. Decided before any tenant
        resolution, so `detail` leaks nothing about tenancy — it is the only
        error response permitted to carry one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: |
        No usable authentication artifact was presented. Uniform: absent,
        malformed, unknown, expired, revoked and epoch-superseded artifacts
        are indistinguishable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        The principal does not hold the operation's formula at instance scope.
        Instance-class operations have no tenant object whose nonexistence
        could be mimicked, so the probe contract here is grant refusal, not
        tenancy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: |
        The addressed object does not exist **or** the principal may not reach
        it — indistinguishable by design, byte-identical in status and body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: |
        The instance-wide admission budget or a per-source limit is
        exhausted. Uniform on every path, with no unbounded work performed.
      headers:
        Retry-After:
          required: true
          description: Whole seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: An unexpected server fault. The cause is logged, never returned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ID:
      type: string
      description: A prefixed UUIDv7, e.g. `org_0198…`.
      minLength: 3
      maxLength: 64
      pattern: "^[a-z]{2,8}_[0-9a-fA-F-]{36}$"

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 UTC, microsecond precision.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: |
                Fixed per code. Never derived from the request, so two
                refusals of the same class are byte-identical.
            detail:
              type: [string, "null"]
              description: |
                Present only on `bad_request`, where it names the offending
                request member. `null` and absent are equivalent; every other
                error code omits the member entirely.

    ErrorCode:
      type: string
      description: Closed set — never grows. Clients branch on this, not on prose.
      enum:
        - bad_request
        - unauthenticated
        - forbidden
        - not_found
        - too_many_requests
        - internal

    Meta:
      type: object
      description: |
        An exact closed allowlist. `additionalProperties: false` is the
        allowlist's teeth: a field added here is a visible spec change, not a
        quiet leak of instance configuration to unauthenticated callers.
      additionalProperties: false
      required: [server_version, api_revision, protocol_capabilities]
      properties:
        server_version:
          type: string
          description: The build's version string; `dev` for unreleased builds.
        api_revision:
          type: integer
          minimum: 1
          description: |
            This server's API revision. A client refuses an operation whose
            `x-wenv-min-revision` exceeds it, naming the server version — a
            loud refusal, never a silent misbehave.
        protocol_capabilities:
          type: array
          description: |
            Which authentication protocol flows this instance serves. `login`
            needs this before any session exists.
          items:
            $ref: "#/components/schemas/ProtocolCapability"

    ProtocolCapability:
      type: string
      description: |
        OPEN enum: an instance may advertise a flow this client has never
        heard of, and every generated consumer must preserve and tolerate the
        unknown value rather than reject the response.
      x-extensible-enum:
        - local-password
        - loopback-handoff
        - device-code
        - oidc
        - webauthn

    EstablishCredentialRequest:
      type: object
      additionalProperties: false
      required: [authority, password]
      properties:
        authority:
          type: string
          description: |
            The single-use credential-establishment authority, exactly as
            delivered. Never logged, never audited, never echoed.
          minLength: 16
          maxLength: 256
        password:
          type: string
          description: |
            The initial credential. Minimum length 12, no composition rules,
            no forced rotation (NIST SP 800-63B shape); checked against a
            bundled common-password list at set time only, never at login.
          minLength: 12
          maxLength: 1024

    LocalLoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 256
        password:
          type: string
          minLength: 1
          maxLength: 1024

    LoginResult:
      type: object
      required: [session_token, session, principal]
      properties:
        session_token:
          type: string
          description: |
            The bearer value, returned exactly once. A replayable credential:
            cookie attributes constrain browsers, not an attacker holding the
            value, which is why lifetimes are short and revocation is a
            delete.
        session:
          $ref: "#/components/schemas/Session"
        principal:
          $ref: "#/components/schemas/Principal"

    WhoAmI:
      type: object
      required: [session, principal]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        principal:
          $ref: "#/components/schemas/Principal"

    TotpEnrolStartRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          description: |
            The account-security proof: the pre-existing password. Verified
            before a pending seed is staged; never logged, never echoed.
          minLength: 1
          maxLength: 1024

    TotpEnrolStartResult:
      type: object
      additionalProperties: false
      required: [otpauth_uri]
      properties:
        otpauth_uri:
          type: string
          description: |
            The `otpauth://totp/...` provisioning URI, returned exactly once.
            The seed is never re-retrievable.

    TotpCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          description: A TOTP code from the enrolled authenticator.
          minLength: 6
          maxLength: 10

    TotpProofRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          description: The account-security proof for removing the factor.
          minLength: 1
          maxLength: 1024

    RecoveryProofRequest:
      type: object
      additionalProperties: false
      required: [proof]
      properties:
        proof:
          type: string
          description: |
            The account-security proof: the confirmed TOTP code where one
            stands, else the password.
          minLength: 1
          maxLength: 1024

    RecoveryCodesResult:
      type: object
      required: [recovery_codes, login]
      properties:
        recovery_codes:
          type: array
          description: The plaintext single-use codes, displayed once and never again.
          items:
            type: string
        login:
          $ref: "#/components/schemas/LoginResult"

    RecoveryBeginRequest:
      type: object
      additionalProperties: false
      required: [username, code]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 256
        code:
          type: string
          minLength: 1
          maxLength: 256

    RecoveryBeginResult:
      type: object
      additionalProperties: false
      required: [authority, expires_at]
      properties:
        authority:
          type: string
          description: |
            The single-use credential-establishment authority, returned once.
            It creates no session: establish a password with it, then log in.
        expires_at:
          $ref: "#/components/schemas/Timestamp"

    Session:
      type: object
      required: [id, artifact, created_at, idle_expires_at, absolute_expires_at, assurance]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        artifact:
          $ref: "#/components/schemas/SessionArtifact"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        idle_expires_at:
          $ref: "#/components/schemas/Timestamp"
        absolute_expires_at:
          $ref: "#/components/schemas/Timestamp"
        assurance:
          $ref: "#/components/schemas/Assurance"

    SessionArtifact:
      type: string
      description: |
        OPEN enum: human sessions are per-client-class artifacts and new
        classes are additive. A browser cookie's attributes protect nothing on
        a non-browser client, and conflating the two hides which artifact was
        actually used.
      x-extensible-enum:
        - cli
        - browser

    Assurance:
      type: object
      description: |
        How **this session** authenticated — not what the account owns.
        Authorization of an MFA-mandatory capability consults this record at
        the same chokepoint as `authorize()`, in the same transaction,
        uncached.
      required: [method, factors, authenticated_at]
      properties:
        method:
          $ref: "#/components/schemas/AuthMethod"
        factors:
          type: array
          description: The factor classes actually presented in this session.
          items:
            $ref: "#/components/schemas/FactorClass"
        authenticated_at:
          $ref: "#/components/schemas/Timestamp"
        ceremony_id:
          type: [string, "null"]
          description: |
            The factor ceremony this session's assurance came from, where one
            occurred. `null` for a single-factor password login.

    AuthMethod:
      type: string
      description: OPEN enum — `oidc:<issuer>` values are instance-specific by construction.
      x-extensible-enum:
        - local-password
        - local-passkey

    FactorClass:
      type: string
      description: OPEN enum — new factor classes are additive.
      x-extensible-enum:
        - password
        - totp
        - webauthn
        - recovery-code

    Principal:
      type: object
      required: [id, kind]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        kind:
          $ref: "#/components/schemas/PrincipalKind"
        display_name:
          type: [string, "null"]
          description: For display only. Never a linking key, at any point, for any provider.

    PrincipalKind:
      type: string
      description: Closed set — the human/machine distinction is structural in audit attribution.
      enum: [human, machine]

    CreateOrgRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        active:
          type: boolean
          default: true
        metadata:
          type: [object, "null"]
          description: |
            Free-form operator metadata. `null` and absent both mean "no
            metadata"; the round-trip of absent/null/value is fixture-pinned
            through both the Go and the TypeScript consumer.

    Org:
      type: object
      required: [id, name, active, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
        active:
          type: boolean
        metadata:
          type: [object, "null"]
        created_at:
          $ref: "#/components/schemas/Timestamp"

    OrgList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Org"
        count:
          type: integer
          minimum: 0
          description: Total rows matching, which for an unpaged list equals `items` length.

    AuthMethods:
      type: object
      additionalProperties: false
      required: [providers, local_login_enabled]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/AuthMethodProvider"
        local_login_enabled:
          type: boolean

    AuthMethodProvider:
      type: object
      additionalProperties: false
      required: [slug, display_name]
      properties:
        slug:
          type: string
        display_name:
          type: string

    OidcStartRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose:
          type: string
          enum: [login, link, reauth]
        environment_id:
          type: string
          maxLength: 64
          description: Required for reauth; the window scope.
        proof:
          type: string
          maxLength: 1024
          description: Required for link; the pre-existing password.

    OidcStartResult:
      type: object
      additionalProperties: false
      required: [authorization_url]
      properties:
        authorization_url:
          type: string
          description: The IdP authorization URL to redirect the browser to.

    IdentityLinkRequest:
      type: object
      additionalProperties: false
      required: [provider, proof]
      properties:
        provider:
          type: string
          maxLength: 64
        proof:
          type: string
          maxLength: 1024

    IdentityUnlinkRequest:
      type: object
      additionalProperties: false
      required: [proof]
      properties:
        proof:
          type: string
          maxLength: 1024

    ExternalIdentity:
      type: object
      additionalProperties: false
      required: [id, issuer, subject, provider_id, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        issuer:
          type: string
        subject:
          type: string
        provider_id:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"

    IdentityList:
      type: object
      additionalProperties: false
      required: [identities]
      properties:
        identities:
          type: array
          items:
            $ref: "#/components/schemas/ExternalIdentity"

    OidcProviderInput:
      type: object
      additionalProperties: false
      required: [display_name, issuer, client_id, client_secret, scopes, enabled]
      properties:
        display_name:
          type: string
          maxLength: 256
        issuer:
          type: string
          maxLength: 2048
          description: Byte-exact, immutable after create (A3).
        client_id:
          type: string
          maxLength: 1024
        client_secret:
          type: string
          maxLength: 4096
          description: Envelope-encrypted at rest; never returned.
        scopes:
          type: string
          maxLength: 1024
        jit_policy:
          type: [string, "null"]
          maxLength: 4096
          description: JSON `{claim, values[]}`; absent means no JIT.
        assurance_policy:
          type: [string, "null"]
          maxLength: 4096
          description: JSON `{acr_values[], amr_sets[][]}`; absent means single-factor.
        enabled:
          type: boolean

    OidcProvider:
      type: object
      additionalProperties: false
      required: [slug, display_name, issuer, client_id, scopes, redirect_uri, enabled]
      properties:
        slug:
          type: string
        display_name:
          type: string
        issuer:
          type: string
        client_id:
          type: string
        scopes:
          type: string
        redirect_uri:
          type: string
        jit_policy:
          type: [string, "null"]
        assurance_policy:
          type: [string, "null"]
        enabled:
          type: boolean

    OidcProviderList:
      type: object
      additionalProperties: false
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/OidcProvider"

    WebauthnOptions:
      type: object
      additionalProperties: true
      description: |
        Opaque WebAuthn ceremony options (creation or request), generated by
        the relying party and handed to the browser `navigator.credentials`
        API verbatim. The server treats the blob as raw bytes; the base64url
        fields the authenticator signs over are preserved by round-tripping.

    WebauthnResponse:
      type: object
      additionalProperties: true
      description: |
        Opaque WebAuthn authenticator response (attestation or assertion) as
        produced by the browser, passed to the relying party as raw bytes.

    WebauthnEnrolStartRequest:
      type: object
      additionalProperties: false
      description: |
        The account-security proof, where the account has one to give. Both
        members are optional so a passwordless, factorless account can open a
        ceremony; the service enforces which proof it requires.
      properties:
        password:
          type: string
          maxLength: 1024
          description: The pre-existing password proof.
        code:
          type: string
          maxLength: 16
          description: A confirmed TOTP code proof.

    WebauthnReauthStartRequest:
      type: object
      additionalProperties: false
      required: [environment_id, key_ids]
      properties:
        environment_id:
          type: string
          maxLength: 64
        key_ids:
          type: array
          description: The credential ids the reauthentication is bound to.
          items:
            type: string
            maxLength: 256

    WebauthnCredentialProofRequest:
      type: object
      additionalProperties: false
      description: |
        The account-security proof for removing a credential — the pre-existing
        password or a TOTP code, never the credential being removed (B7). Both
        optional; the service selects and enforces the required proof.
      properties:
        password:
          type: string
          maxLength: 1024
        code:
          type: string
          maxLength: 16

    WebauthnReauthResult:
      type: object
      additionalProperties: false
      required: [session_id, environment_id, single_decision, window_expires]
      properties:
        session_id:
          $ref: "#/components/schemas/ID"
        environment_id:
          type: string
        single_decision:
          type: boolean
          description: True where the effective window is zero — the window authorizes exactly one decision.
        window_expires:
          $ref: "#/components/schemas/Timestamp"

    PasskeyList:
      type: object
      additionalProperties: false
      required: [passkeys]
      properties:
        passkeys:
          type: array
          items:
            $ref: "#/components/schemas/Passkey"

    Passkey:
      type: object
      additionalProperties: false
      required: [id, label, discoverable, disabled, created_at, last_used_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        label:
          type: string
        discoverable:
          type: boolean
        disabled:
          type: boolean
          description: True for a credential disabled after a signature-count clone was detected.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        last_used_at:
          $ref: "#/components/schemas/Timestamp"

security:
  - wenvSession: []
