openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info: {title: fixture, version: "1"}
paths:
  /api/v1/thing:
    get:
      operationId: getThing
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [id, state]
                properties:
                  id: {type: string}
                  state:
                    type: string
                    enum: [active, retired]
    post:
      operationId: makeThing
      security:
        - fixtureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
      responses:
        "201": {description: created}
  /api/v1/legacy:
    get:
      operationId: getLegacy
      deprecated: true
      security: []
      responses:
        "200": {description: ok}
components:
  securitySchemes:
    fixtureAuth:
      type: http
      scheme: bearer
webhooks:
  thingChanged:
    post:
      responses:
        "200": {description: ok}
